<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F5F1">
<title>Lado B · Consultorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17201B; --muted:#56605A; --soft:#6B746E; --line:#DDE1DA; --line2:#E6E9E4; --grid:#EEF0EC;
  --bg:#F4F5F1; --card:#fff; --lima:#D4FF3A;
  --conf:#FFE7A3; --canc:#F9D3CE; --cancInk:#7A2E25; --pendLine:#A3862A; --bloq:#DCE4E8; --bloqInk:#3E4E57;
  --ok:#2E7D3E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:'Archivo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:1440px;margin:0 auto;padding:18px 28px 28px;display:flex;flex-direction:column;gap:12px}

/* Encabezado */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"nav logo who";align-items:center;gap:16px}
.nav{grid-area:nav;display:flex;gap:4px}
.nav button{border:0;background:transparent;font-size:13px;font-weight:600;color:#3D4741;height:34px;padding:0 12px;border-radius:8px;cursor:pointer}
.nav button:hover{background:#E6E9E2}
.nav button.on{background:var(--ink);color:#fff}
.logo{grid-area:logo;display:flex;justify-content:center;line-height:0}
.logo img{height:58px;width:auto;display:block}
.who{grid-area:who;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1.plain{text-transform:none;letter-spacing:0;font-size:16px}
#switchBtn{height:32px;font-size:12.5px;font-weight:600;padding:0 12px}
.btn{font-size:13px;font-weight:600;height:36px;padding:0 14px;border-radius:8px;border:1px solid #C9CFC8;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#9AA39C}
.btn.icon{width:36px;padding:0}
.btn.pill{border-radius:999px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2A352F}
.row2{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.period{font-weight:800;font-size:17px;min-width:170px;text-align:center}

/* Agenda */
.board{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid{display:grid;min-width:900px}
.corner{border-bottom:1px solid var(--line)}
.dayhead{padding:10px 12px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.dn{font-weight:700;font-size:14px}
.num{font-weight:800;font-size:20px}
.cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.dayhead.today .num{background:var(--lima);border-radius:6px;padding:0 6px}
.times{display:flex;flex-direction:column}
.tm{height:30px;font-size:10.5px;color:var(--soft);text-align:right;padding:4px 8px 0 0;font-variant-numeric:tabular-nums}
.tm.full{color:var(--ink);font-weight:600}
.daycol{position:relative;border-left:1px solid var(--line2);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0 29px,var(--grid) 29px 30px)}
.daycol.today{background-color:#FBFDF1}
.daycol:hover{background-color:#FAFBF8}
.daycol.today:hover{background-color:#F7FBE6}
.now{position:absolute;left:0;right:0;height:2px;background:#E2462F;z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#E2462F}
.ev,.blk{position:absolute;left:3px;width:calc(100% - 6px);z-index:2;justify-content:flex-start;border:0;border-radius:4px;text-align:left;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:11.5px;cursor:pointer;overflow:hidden}
.ev:hover,.blk:hover{box-shadow:inset 0 0 0 1.5px rgba(23,32,27,.55)}
.ev:focus-visible,.blk:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.ev .t{flex:none;width:28px;font-size:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .nm{text-align:left;flex:1 1 auto;min-width:0;font-weight:500;line-height:1.08;overflow-wrap:anywhere}
.ev .meta{flex:none;margin-left:auto;display:flex;gap:4px;align-items:center}
.tag{font-size:9.5px;font-weight:800;padding:1px 4px;border-radius:3px;background:rgba(23,32,27,.12)}
.ev.c{background:var(--conf)}
.ev.x{background:var(--canc)}
.ev.x .nm{text-decoration:line-through;color:var(--cancInk)}
.ev.p{background:#fff;border:1.5px dashed var(--pendLine)}
.ev.dup{padding:0 5px;gap:4px}
.ev.dup .nm{font-size:10.5px;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev.dup .tag{font-size:8.5px;padding:1px 3px}
.warnin{display:block;background:#FFF6DC;border:1px solid #EBCB6B;color:#5C4505;border-radius:8px;padding:10px 12px;font-weight:600}
.pay{flex:none;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.pay.ok{background:var(--ok);color:#fff}
.pay.no{border:1.5px solid #8A938D;color:#6B746E;background:rgba(255,255,255,.5)}
.blk{background-color:var(--bloq);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.55) 6px 9px);justify-content:center;color:var(--bloqInk)}
.blk.tall{flex-direction:column;gap:2px}
.blk .bl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.blk .blr{font-size:11px}
.blk .bln{font-size:12px;font-weight:600;background:#fff;padding:1px 6px;border-radius:3px;margin-top:3px;max-width:100%;text-align:center}
.tabs{display:none}
.fab{display:none}
@media(max-width:760px){
  .app.fixmob{height:100vh;height:100dvh;overflow:hidden;padding-bottom:0}
  .app.fixmob #main{flex:1;min-height:0;display:flex;flex-direction:column}
  .app.fixmob .board{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-bottom-left-radius:0;border-bottom-right-radius:0}
  .app.fixmob .foot{display:none}
}

/* Pagos */
.col{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.col{max-width:760px}
.totals{display:flex;justify-content:center;gap:10px}
.tot{flex:0 1 287px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;gap:2px}
.tot span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tot span em{font-style:normal;text-transform:none;letter-spacing:0;margin-left:4px}
.tot b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.tot small{font-size:12px;color:var(--muted)}
.tot.hi{background:var(--ink);border-color:var(--ink);color:#fff}
.tot.hi span,.tot.hi small{color:#C9D1CB}
.tot.fc{background:var(--lima);border-color:var(--lima)}
.tot.fc span,.tot.fc small{color:#2C3A0A}
.table{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thead,.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 100px 128px 72px;align-items:center;column-gap:12px;padding:0 16px}
.prow{border-top:1px solid #F0F2EE}
.table .prow:nth-child(2){border-top:0}
.amt.debe{color:#A12F22;font-weight:800}
.prow.debe{background:#FFF8F6}
.prow.debe:hover{background:#FFF1EE}
.wa.off{background:#F1F2EE;border-color:#E1E4DE;color:#A3AAA5;cursor:not-allowed;pointer-events:none}.wa.off svg{opacity:.45;filter:grayscale(1)}
.prow2{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:4px 0 12px}.prow2 .lbl{margin:0;min-width:104px}.prow2 .seg{flex:1}
.pdin{font:inherit;font-size:13.5px;font-weight:600;height:32px;border:0;border-bottom:1.5px solid #C9CFC8;background:transparent;padding:0 2px;color:var(--ink);outline:none}.pdin:focus{border-bottom-color:var(--ink)}
.pmontos{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 14px}.pmontos .seg{flex:1}.pmontos{border-bottom:1px solid #ECEEE9;row-gap:0}.pmontos .seg{flex:none;border-bottom:0}
.pmo{font:inherit;font-size:13px;font-weight:500;width:84px;height:30px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0 2px;color:var(--ink);outline:none}
.pmo::placeholder{color:#B3BAB4}.pmo:focus{border-bottom-color:#C9CFC8}.pmo.on{font-weight:700;border-bottom-color:var(--ink)}
@media(max-width:700px){.prow2 .lbl{min-width:0}}
.seg.mseg{display:flex;gap:14px;flex-wrap:wrap}
.qwrap{display:flex;justify-content:flex-end;align-items:center;gap:7px}
.qd{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid #9A3324;background:#fff;color:#9A3324;font:inherit;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.qd:hover{background:#FFF1EE}.qd.on{background:#17201B;border-color:#17201B;color:#D4FF3A}
.qpop{position:absolute;z-index:60;width:228px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(23,32,27,.18),0 0 0 1px rgba(23,32,27,.06);padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.qpop:before{content:'';position:absolute;top:-6px;left:var(--ax,190px);width:12px;height:12px;background:#fff;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(23,32,27,.06)}
.qnm{font-size:12px;font-weight:700;color:#3D4741;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qpop select,.qpop input{font:inherit;font-size:13px;font-weight:600;height:30px;width:100%;border:0;border-bottom:1.5px solid #C9CFC8;border-radius:0;background:transparent;padding:0 2px;color:#17201B;outline:none}
.qpop select:focus,.qpop input:focus{border-bottom-color:#17201B}
.qerr{margin:0;font-size:11.5px;font-weight:600;color:#9A3324}
.qft{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.qcn,.qgo{font:inherit;font-size:12.5px;height:28px;padding:0 2px;border:0;background:none;cursor:pointer}
.qcn{font-weight:600;color:#7A837D}
.qgo{font-weight:800;color:#17201B;border-bottom:2px solid #17201B;border-radius:0}
.pdate{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.thead{height:38px;background:#F6F7F3;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.r{text-align:right}.c{text-align:center}
.dayrow{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 6px;border-top:1px solid var(--line2)}
.table .dayrow:nth-child(2){border-top:0}
.dayrow b{font-size:14px;font-weight:800}
.dayrow span{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.prow{min-height:42px;font-size:13.5px}
.prow:hover{background:#FAFBF7}
.pname{border:0;background:transparent;text-align:left;padding:8px 0;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.pname:hover span:first-child{text-decoration:underline}
.amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chip{justify-self:start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF0EA;color:#3D4741;white-space:nowrap}
.chip.mp{background:#E3EEFB;color:#1F4B7A}
.chip.ef{background:#E9F5DA;color:#2C4A12}
.chip.tj{background:#F1E6FA;color:#55267A}
.ck{justify-self:center;display:flex;align-items:center;justify-content:center;width:44px;height:42px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--ink);cursor:pointer;margin:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.lbox img{width:180px;height:auto;align-self:center}
.lsub{margin:0 0 4px;text-align:center;color:var(--muted);font-size:13.5px}
.lforgot{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px}
.foot button{border:0;background:none;color:#2F5D3A;text-decoration:underline;cursor:pointer;font-size:12px;padding:4px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(23,32,27,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay[hidden]{display:none}
.dlg{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dh{padding:20px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2)}
.dh h2{margin:0;font-size:21px;font-weight:800;line-height:1.15}
.dh p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.xbtn{flex:none;width:40px;height:40px;border:0;background:#F1F2EE;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sec{padding:16px 22px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line2)}
.sec:last-of-type{border-bottom:0}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg button{font-size:13.5px;font-weight:600;height:42px;border:1px solid #C9CFC8;border-radius:8px;background:#fff;cursor:pointer;padding:0 6px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
[data-seg="llegada"] button[data-val="Google"]{color:#A3352A}
[data-seg="llegada"] button[data-val="Instagram"]{color:#A8296F}
[data-seg="llegada"] button[data-val="Referido"]{color:#1F5A9E}
[data-seg="llegada"] button[data-val="Otro"]{color:#8A6A0B}
[data-seg="llegada"] button.on[data-val="Google"]{background:#F6D3CE;border-color:#E09A90;color:#7E2219}
[data-seg="llegada"] button.on[data-val="Instagram"]{background:#FAD3E8;border-color:#E79BC4;color:#7D1A50}
[data-seg="llegada"] button.on[data-val="Referido"]{background:#D3E4F8;border-color:#93B7E2;color:#173F70}
[data-seg="llegada"] button.on[data-val="Otro"]{background:#FFE7A3;border-color:#E0B12A;color:#5C4505}
[data-seg="llegada"] button.on{font-weight:800}
.lleg{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;justify-self:start}
.lleg.Google{background:#F6D3CE;color:#7E2219}.lleg.Instagram{background:#FAD3E8;color:#7D1A50}.lleg.Referido{background:#D3E4F8;color:#173F70}.lleg.Otro{background:#FFE7A3;color:#5C4505}
.ficha{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.12em;height:28px;padding:0 11px;border-radius:6px;border:1px solid #D9DDD5;background:transparent;color:#56605A;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.ficha svg{opacity:.7}
.ficha:hover{border-color:var(--ink);color:var(--ink);background:#fff}
.warn{margin:0;background:#FFF6DC;border:1px solid #EBCB6B;color:#5C4505;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}
.warn b{font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.seg.estado button.on[data-val="c"]{background:var(--conf);border-color:#E0B12A;color:var(--ink)}
.seg.estado button.on[data-val="p"]{background:#FFF8E1;border:2px dashed var(--pendLine);color:var(--ink)}
.seg.estado button.on[data-val="x"]{background:var(--canc);border-color:#E3A097;color:var(--cancInk)}
.seg.estado button{color:#8A938D;font-weight:500}
.seg.estado button.on{font-weight:800}
.seg.estado button.on::before{content:"✓ "}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:13px;font-weight:600}
.fld>span em{font-style:normal;font-weight:500;color:var(--muted)}
.fld input,.fld select{font:inherit;font-size:15px;font-weight:500;height:44px;border:1px solid #C9CFC8;border-radius:8px;padding:0 12px;width:100%;color:var(--ink);background:#fff;min-width:0}
.fld input:focus,.fld select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.err{margin:0;color:#A12F22;font-size:13px;font-weight:600}
[hidden]{display:none!important}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:100}
.splash img{width:170px;height:auto}
.splash p{margin:0;font-size:13px;color:var(--muted);text-align:center;max-width:280px;line-height:1.4}
.spin{width:26px;height:26px;border-radius:50%;border:2.5px solid #DDE1DA;border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.psearch{font:inherit;font-size:14px;height:36px;border:1px solid #C9CFC8;border-radius:8px;padding:0 12px;background:#fff;color:var(--ink);flex:1;min-width:0;max-width:360px}
.psearch:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.slist{width:100%;max-width:760px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 64px 100px auto;align-items:center;column-gap:12px;padding:6px 16px;min-height:46px;border-top:1px solid #F0F2EE}
.srow:first-child{border-top:0}
.srow:hover{background:#FAFBF7}
.srow .pc{font-size:12.5px}
.srow .pc .lleg{font-style:normal}
.srow.shead{min-height:34px;background:#F6F7F3;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.srow.shead:hover{background:#F6F7F3}
.pwrap{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ptitle{margin:6px 0 0;font-size:15px;font-weight:800}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}.phead .ptitle{margin:0}
.pcnt{display:flex;gap:6px;flex:none}.pcnt em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#7A837D;border-bottom:2px solid #D9DED6;padding:0 4px 3px;white-space:nowrap}
.pcnt b{font-size:13px;font-weight:400;color:#17201B;margin-left:3px;letter-spacing:0}.pcnt .t{border-color:#D4FF3A}
#row2 .psearch{max-width:420px}
.ficha.ttl{vertical-align:middle;margin-left:8px;height:26px;font-size:10px}
.yrs{display:inline-flex;background:#E9EBE5;border-radius:10px;padding:3px;gap:2px}
.yrs button{border:0;background:transparent;font-size:13.5px;font-weight:700;height:34px;padding:0 16px;border-radius:8px;cursor:pointer;color:#3D4741}
.yrs button.on{background:var(--ink);color:#fff}
.stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
.stcard.wide{grid-column:1/-1;justify-self:center;width:min(100%,960px)}
.stcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px;overflow-x:auto}
.stcard h3{margin:0 0 8px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#3D4741}
.stcard h3 small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px}
.st{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.st th{font-size:10.5px;font-weight:700;color:var(--muted);text-align:right;padding:4px 6px;letter-spacing:.04em;white-space:nowrap}
.st th:first-child,.st td:first-child{text-align:left}
.st td{padding:4px 6px;text-align:right;border-top:1px solid #F2F3EF;white-space:nowrap}
.st td:first-child{color:#3D4741;text-transform:capitalize}
.st tr.best td{background:#EEF8CF;font-weight:700}
.st tr.best td:first-child::after{content:' ★';color:#7BA319}
.st tr.next td{background:#E3EEFB}
.st tr.next td:first-child::after{content:' · próx. aumento';font-size:10px;font-weight:700;color:#2C5C9A}
.st tr.totr td{border-top:1.5px solid var(--ink);font-weight:800}
.st .neg{color:#A12F22}
.st .dim{color:#B5BBB4}
.stin{font:inherit;font-size:12.5px;width:96px;height:26px;border:1px dashed #C9CFC8;border-radius:5px;padding:0 6px;text-align:right;background:#FCFCFA;color:var(--ink);font-variant-numeric:tabular-nums}
.stin:focus{outline:2px solid var(--ink);outline-offset:-1px;border-style:solid;background:#fff}
.stnote{font-size:11.5px;color:var(--muted);margin:6px 0 0}
.msel{font:inherit;font-size:14px;font-weight:700;height:36px;border:1px solid #C9CFC8;border-radius:8px;background:#fff;color:var(--ink);padding:0 10px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.ptable{background:#fff;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.pt{min-width:1040px}
.ph,.pr{display:grid;grid-template-columns:var(--cols);align-items:center;column-gap:10px;padding:0 14px}
.ph{position:sticky;top:0;background:#F6F7F3;border-bottom:1px solid var(--line);padding-top:8px;padding-bottom:8px;z-index:1}
.phc{display:flex;align-items:center;gap:2px;min-width:0}
.pfi{font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink);border:1px solid transparent;background:transparent;border-radius:6px;height:30px;padding:0 6px;width:100%;min-width:0}
.pfi::placeholder{color:#56605A;text-transform:uppercase;font-weight:700}
.pfi:hover{border-color:#DCE0D9;background:#fff}
.pfi:focus{outline:0;border-color:var(--ink);background:#fff}
.pfi:not(:placeholder-shown){background:#FFF8D6;border-color:#E9CF63}
.psort{flex:none;width:22px;height:26px;border:0;background:transparent;border-radius:5px;font-size:12px;color:#9AA29C;cursor:pointer}
.psort:hover{background:#E9EBE5;color:var(--ink)}
.psort.on{color:var(--ink);font-weight:800}
.pr{min-height:42px;border-top:1px solid #F0F2EE;font-size:13px}
.pr:hover{background:#FAFBF7}
.pc{min-width:0;font-size:12.5px;color:#3D4741;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc.num{font-variant-numeric:tabular-nums}
.pc.pn{white-space:normal;line-height:1.25;max-height:2.5em}
.pc .lleg{font-style:normal}
.pck{display:flex;justify-content:center}
.pck input{width:17px;height:17px;accent-color:var(--ink);cursor:pointer;margin:0}
.pr .pacname{font-size:13px;text-align:left}
.pmore{padding:14px;text-align:center;border-top:1px solid #F0F2EE}
.fwrap{display:flex;flex-direction:column;gap:16px}
.ftop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.crumb{font-size:13px;color:#7A837D;display:flex;gap:8px;align-items:center;min-width:0}
.crumb button{border:0;background:none;padding:0;font-size:13px;color:#7A837D;cursor:pointer}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.crumb b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtns{display:flex;gap:8px}
.fbody{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.fcard{flex:0 0 270px;background:#fff;border:1px solid #E3E6E0;border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;position:sticky;top:16px}
.fav{width:64px;height:64px;border-radius:50%;background:#E9F9B5;color:#2F3D0A;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.fcard h2{margin:0 0 3px;font-size:19px;font-weight:600;line-height:1.2}
.fsub{font-size:12.5px;color:#7A837D}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:9px 0;border-top:1px solid #F0F2EE}
.kv span:first-child{color:#7A837D}
.kv span:last-child{font-weight:500;text-align:right}
.kv em{font-style:normal}
.fwa{display:flex;align-items:center;justify-content:center;gap:7px;height:36px;border:1px solid #CFE5C8;background:#F1F9EE;color:#1D4D17;border-radius:8px;font-size:12.5px;font-weight:600;text-decoration:none}
.fwa svg{width:15px;height:15px}
.flink{border:0;background:none;font-size:12px;color:#56605A;text-decoration:underline;cursor:pointer;padding:2px}
.fmain{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px}
.fsec{background:#fff;border:1px solid #E3E6E0;border-radius:14px;padding:26px 30px;display:flex;flex-direction:column;gap:20px}
.fh{margin:0;font-size:12px;font-weight:600;letter-spacing:.04em;display:flex;align-items:center;gap:10px;flex:1}
.fh::after{content:"";flex:1;height:1px;background:#EBEDE8}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 24px}
.ff{display:flex;flex-direction:column;gap:4px;min-width:0}
.ff.span2{grid-column:span 2}
.ff>span{font-size:11px;font-weight:500;color:#7A837D}
.ff input,.ff textarea{font:inherit;font-size:14px;color:var(--ink);border:0;border-bottom:1px solid #D9DDD5;padding:4px 0 7px;background:transparent;width:100%;border-radius:0}
.ff textarea{resize:vertical;line-height:1.45;min-height:46px}
.ff input:focus,.ff textarea:focus{outline:0;border-bottom-color:var(--ink)}
.fnac{display:flex;align-items:flex-end;gap:8px}
.fnac input{flex:1;min-width:0}
.fnac em{flex:none;font-style:normal;font-size:12px;font-weight:600;color:#3D5212;padding-bottom:8px}
.fmot{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.fmot>span{font-size:11px;font-weight:500;color:#7A837D}
.fcb{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;min-height:32px}
.fcb input{width:17px;height:17px;accent-color:var(--ink);margin:0;cursor:pointer}
.hch{display:flex;align-items:center;gap:14px}
.hcform{display:flex;flex-direction:column;gap:14px;background:#FAFBF7;border:1px solid #E8EBE4;border-radius:10px;padding:16px 18px}
.hcdate{max-width:220px}
.hcform textarea{background:#fff;border:1px solid #DCE0D9;border-radius:8px;padding:10px 12px;min-height:130px}
.hcform textarea:focus{border-color:var(--ink)}
.hcbtns{display:flex;justify-content:flex-end;gap:8px}
.hcempty{margin:0;font-size:13px;color:#7A837D}
.hcitem{border-top:1px solid #EEF0EB;padding-top:14px;display:flex;flex-direction:column;gap:8px}
.hcitem:first-of-type{border-top:0;padding-top:0}
.hcform+.hcitem{border-top:1px solid #EEF0EB;padding-top:14px}
.hcitem header{display:flex;align-items:baseline;gap:10px}
.hcitem header b{font-size:13.5px;font-weight:600}
.hcitem header span{font-size:12px;color:#8A938D}
.hcact{margin-left:auto;display:flex;gap:4px}
.hcact button{border:0;background:none;font-size:12px;color:#7A837D;cursor:pointer;padding:4px 6px;border-radius:6px;height:auto}
.hcact button:hover{background:#F1F2EE;color:var(--ink)}
.hcact .danger{color:#A12F22}
.hcact .danger.sure{background:#A12F22;color:#fff}
.hcitem p{margin:0;font-size:14px;line-height:1.55;white-space:pre-wrap;color:#2A332E}
.search{font:inherit;font-size:14px;height:36px;border:1px solid #C9CFC8;border-radius:8px;padding:0 12px;background:#fff;color:var(--ink);flex:1;min-width:0;max-width:340px}
.pacrowl{display:grid;grid-template-columns:minmax(0,1fr) 50px 100px 80px auto;align-items:center;column-gap:12px;padding:6px 16px;min-height:48px;border-top:1px solid #F0F2EE;font-size:13.5px}
.pacname{border:0;background:transparent;text-align:left;cursor:pointer;padding:6px 0;font-size:13.5px;min-width:0}
.pacname:hover b{text-decoration:underline}
.pacrowl:first-child{border-top:0}
.pacrowl:hover{background:#FAFBF7}
.pacrowl b{font-weight:600}
.lleg{align-self:center}
.pacrowl small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.pacrowl .pl{font-size:12.5px;color:var(--muted)}
.fields.three{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
.pacrow{display:flex;gap:8px;align-items:stretch}
.combo{position:relative;flex:1;min-width:0}
.combo input{font:inherit;font-size:15px;font-weight:500;height:44px;border:1px solid #C9CFC8;border-radius:8px;padding:0 12px;width:100%;color:var(--ink);background:#fff}
.combo input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.combo input.ok{border-color:#7BA319;background:#FAFDF2}
.opts{position:absolute;left:0;right:0;top:48px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(23,32,27,.15);max-height:260px;overflow:auto;padding:4px}
.opts button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:10px 10px;border-radius:6px;font-size:14px;cursor:pointer;min-height:40px}
.opts button:hover,.opts button:focus{background:#F1F2EE;outline:0}
.opts button.act{background:#EEF8CF}
.opts button small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.opts .none{padding:10px;font-size:13px;color:var(--muted)}
.addpac{flex:none;width:44px;height:44px;border-radius:8px;border:0;background:var(--ink);color:var(--lima);display:flex;align-items:center;justify-content:center;cursor:pointer}
#overlay2{z-index:60}
.wa{font-size:13.5px;font-weight:600;height:44px;border:1px solid #B9DDB0;background:#EEF8EA;color:#1D4D17;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.wa:hover{background:#E2F3DC}
.paid{display:flex;align-items:center;gap:10px;background:#EEF8EA;border:1px solid #B9DDB0;border-radius:10px;padding:12px 14px;font-size:14px}
.paid b{font-weight:800}
.paid .pay{width:22px;height:22px;font-size:13px}
.paid .acts{margin-left:auto;display:flex;gap:6px}
.df{padding:14px 22px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line2)}
.df .r{display:flex;gap:8px;margin-left:auto}
.btn.big{height:44px;padding:0 18px;font-size:13.5px}
.danger{border:0;background:transparent;color:#A12F22;font-weight:600;font-size:13.5px;height:44px;padding:0 8px;cursor:pointer}
.danger.sure{background:#A12F22;color:#fff;border-radius:8px;padding:0 14px}
details.edit summary{cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;display:flex;align-items:center;gap:6px}
details.edit summary::-webkit-details-marker{display:none}
details.edit summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;line-height:1}
details.edit[open] summary::before{transform:rotate(90deg)}
details.edit[open] summary{margin-bottom:12px}
.chkline{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.chkline input{width:20px;height:20px;accent-color:var(--ink);margin:0}

  .grid{min-width:0}

<script>
(function(){
'use strict';
var NUTRIS={fran:'Fran',car:'Car'}, OTHER={fran:'car',car:'fran'};
var START=8*60, END=21*60, ROW=30;
var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var DCORTO=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MEDIOS=['Efectivo','Mercado Pago','Tarjeta'];
var MEDIO_CLS={'Efectivo':'ef','Mercado Pago':'mp','Tarjeta':'tj'};
var TIPOS=[['','Consulta'],['InBody','InBody'],['Virtual','Virtual']];
var UIKEY='ladob_ui_v1';
try{localStorage.removeItem('ladob_data_v1');localStorage.removeItem('ladob_data_v2')}catch(e){}
var LLEGADAS=['Google','Instagram','Referido','Otro'];
var ICON={
  prev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  plusBig:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  swap:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-4-4"/><path d="M20 16H6l4 4"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  wa:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>'
};

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekday(d){var x=new Date(d);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return x}
function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
function show(m){return Math.floor(m/60)+':'+pad(m%60)}
function hhmm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function toast(msg){var o=document.querySelector('.toast');if(o)o.remove();var d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function money(n){return '$ '+Number(n||0).toLocaleString('es-AR')}
function ddmm(s){var p=s.split('-');return p[2]+'/'+p[1]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function largo(d){return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]}
function isMobile(){return window.matchMedia('(max-width:760px)').matches}
function norm(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

/* ---------- datos ---------- */
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function read(k){try{var s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
var data={turnos:[],bloqueos:[],pagos:[],pacientes:[]};
/* ---------- Firebase ---------- */
var FB_CONFIG={apiKey:"AIzaSyAK5JhG3yBIbuqMMr8SeZbhq7RZlXxWFmI",authDomain:"ladob-consultorio.firebaseapp.com",projectId:"ladob-consultorio",storageBucket:"ladob-consultorio.firebasestorage.app",messagingSenderId:"639263803246",appId:"1:639263803246:web:d297f0d993932888ff637f"};
firebase.initializeApp(FB_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
try{db.settings({cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED,merge:true})}catch(e){}
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
var SVTS=function(){return firebase.firestore.FieldValue.serverTimestamp()};
var COLS=['pacientes','turnos','bloqueos','pagos'], synced={}, loaded={}, unsubs=[], staff=null, pendingRender=false;
COLS.forEach(function(c){synced[c]={}});
function clean(o){return JSON.parse(JSON.stringify(o))}
/* Guarda en Firestore solo lo que cambió respecto de lo último sincronizado */
function save(){
  if(!staff)return;
  var batch=db.batch(), n=0;
  COLS.forEach(function(c){
    var seen={};
    data[c].forEach(function(o){seen[o.id]=1;var j=JSON.stringify(o);if(synced[c][o.id]!==j){synced[c][o.id]=j;var x=clean(o);delete x.id;x.updatedAt=SVTS();batch.set(db.collection(c).doc(o.id),x);n++}});
    /* borrado "suave": se marca como borrado para que los demás dispositivos se enteren sin releer todo */
    Object.keys(synced[c]).forEach(function(id){if(!seen[id]){delete synced[c][id];batch.set(db.collection(c).doc(id),{deleted:true,updatedAt:SVTS()},{merge:true});n++}});
  });
  if(n)batch.commit().catch(function(e){toast('No se pudo guardar. Revisá la conexión e intentá de nuevo.');console.error(e)});
}
function busy(){
  if(!$('#overlay').hidden||!$('#overlay2').hidden)return true;
  var a=document.activeElement;
  return a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='checkbox';
}
function scheduleRender(){if(!staff||!COLS.every(function(c){return loaded[c]}))return;
  if($('.app').hidden){$('.app').hidden=false;$('#splash').hidden=true;$('#login').hidden=true;pendingRender=false;render();return}if(busy()){pendingRender=true;return}pendingRender=false;render()}
/* Sincronización con lecturas mínimas:
   - la primera vez en cada dispositivo se lee todo y queda guardado en el navegador;
   - después se arranca desde esa copia (no cuenta como lectura) y solo se piden a Firebase
     los registros modificados desde la última vez (campo updatedAt). */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function docObj(d){var o=d.data({serverTimestamps:'estimate'})||{},ts=o.updatedAt;delete o.updatedAt;o.id=d.id;return {o:o,ts:ts&&ts.toMillis?ts.toMillis():0,del:!!o.deleted,pend:d.metadata&&d.metadata.hasPendingWrites}}
function applyDocs(c,list,replace){
  var map={};if(!replace)data[c].forEach(function(o){map[o.id]=o});
  list.forEach(function(x){if(x.del)delete map[x.o.id];else map[x.o.id]=x.o});
  data[c]=Object.keys(map).map(function(k){return map[k]});
  synced[c]={};data[c].forEach(function(o){synced[c][o.id]=JSON.stringify(o)});
}
function startCol(c){
  var key='ladob_sync_'+c, last=lsGet(key)||0;
  var full=function(){last=0;return db.collection(c).get({source:'server'})};
  (last?db.collection(c).get({source:'cache'}).then(function(sn){return sn.empty?full():sn}).catch(full):full())
  .then(function(sn){
    var mx=last, list=sn.docs.map(docObj);
    list.forEach(function(x){if(!x.pend&&x.ts>mx)mx=x.ts});
    applyDocs(c,list,true);
    if(!mx)mx=1; lsSet(key,mx);
    loaded[c]=true; scheduleRender();
    var q=db.collection(c).where('updatedAt','>',firebase.firestore.Timestamp.fromMillis(mx));
    unsubs.push(q.onSnapshot({includeMetadataChanges:false},function(s2){
      var ch=s2.docChanges().filter(function(x){return x.type!=='removed'}).map(function(x){return docObj(x.doc)}), m2=lsGet(key)||mx;
      ch.forEach(function(x){if(!x.pend&&x.ts>m2)m2=x.ts});
      lsSet(key,m2);
      if(ch.length){applyDocs(c,ch,false);scheduleRender()}
    },function(e){console.error(e)}));
  }).catch(function(e){console.error(e);showLogin('No se pudieron leer los datos. Puede que tu usuario no tenga permiso.')});
}
function ensureRanges(){}
function listen(){
  unsubs.forEach(function(u){u()});unsubs=[];
  COLS.forEach(startCol);
}
function showLogin(msg){
  $('#login').hidden=false;$('.app').hidden=true;$('#splash').hidden=true;
  var e=$('#lErr');e.textContent=msg||'';e.hidden=!msg;
  var b=$('#lBtn');b.disabled=false;b.textContent='Entrar';
}
auth.onAuthStateChanged(function(u){
  if(!u){staff=null;unsubs.forEach(function(x){x()});unsubs=[];showLogin();return}
  var email=(u.email||'').toLowerCase();
  db.collection('staff').doc(email).get().then(function(d){
    if(!d.exists){auth.signOut();showLogin('Tu usuario ('+email+') todavía no tiene acceso. Pedile a Fede que lo habilite.');return}
    staff=d.data();staff.email=email;
    if(staff.nutri==='fran'||staff.nutri==='car')ui.nutri=staff.nutri;
    $('#who').textContent=(staff.nombre||email);
    $('#login').hidden=true;$('#splash').hidden=false;
    $('#splashTxt').textContent=lsGet('ladob_sync_pacientes')?'Cargando…':'Primera vez en este dispositivo: estamos descargando la base. Puede tardar unos segundos.';
    COLS.forEach(function(c){loaded[c]=false});
    listen();
  }).catch(function(e){console.error(e);auth.signOut();showLogin('Tu usuario no tiene acceso a la base. Pedile a Fede que lo habilite.')});
});


/* ---------- estado de pantalla ---------- */
var ui=(function(){
  var u=read(UIKEY)||{};
  return {view:(u.view==='pagos'||u.view==='pacientes'||u.view==='stats')?u.view:'agenda',q:'',nutri:u.nutri==='car'?'car':'fran',date:weekday(today()),month:new Date(today().getFullYear(),today().getMonth(),1)};
})();
function saveUi(){store(UIKEY,{view:ui.view,nutri:ui.nutri})}

/* ---------- consultas ---------- */
function turnosDe(n,di){return data.turnos.filter(function(t){return t.nutri===n&&t.date===di}).sort(function(a,b){return toMin(a.time)-toMin(b.time)})}
function bloqueosDe(n,di){return data.bloqueos.filter(function(b){return b.nutri===n&&b.date===di})}
function pagoDe(tid){for(var i=0;i<data.pagos.length;i++)if(data.pagos[i].turnoId===tid)return data.pagos[i];return null}
function findT(id){return data.turnos.find(function(t){return t.id===id})}
function findP(id){return data.pagos.find(function(p){return p.id===id})}
function findB(id){return data.bloqueos.find(function(b){return b.id===id})}
function findPac(id){return data.pacientes.find(function(p){return p.id===id})}
function paciente(name){var k=norm(name);return data.pacientes.find(function(p){return norm(p.name)===k})}
function pacDe(t){return (t.pid&&findPac(t.pid))||paciente(t.name)}
/* Selector de paciente: solo se puede elegir de la lista; "+" para cargar uno nuevo */
function pacField(id,pid){
  var p=pid?findPac(pid):null;
  return '<div class="fld full"><span>Paciente</span><div class="pacrow"><div class="combo">'+
    '<input id="'+id+'" class="pacin'+(p?' ok':'')+'" autocomplete="off" placeholder="Buscar paciente…" value="'+esc(p?p.name:'')+'" data-pid="'+(p?p.id:'')+'" role="combobox" aria-expanded="false" aria-controls="'+id+'L">'+
    '<div class="opts" id="'+id+'L" role="listbox" hidden></div></div>'+
    '<button type="button" class="addpac" data-act="newPac" data-for="'+id+'" aria-label="Cargar paciente nuevo" title="Cargar paciente nuevo">'+ICON.plus+'</button></div></div>';
}
function pacOptions(input){
  var q=norm(input.value), list=$('#'+input.id+'L');
  var all=data.pacientes.filter(function(p){return !q||norm(p.name).indexOf(q)>-1});
  all.sort(function(a,b){var x=(a.nutri===ui.nutri?0:1)-(b.nutri===ui.nutri?0:1);return x||a.name.localeCompare(b.name)});
  all=all.slice(0,8);
  list.innerHTML=all.length?all.map(function(p,i){return '<button type="button" role="option" id="'+input.id+'O'+i+'"'+(q&&i===0?' class="act" aria-selected="true"':'')+' data-pick="'+p.id+'" data-for="'+input.id+'"><span>'+esc(p.name)+'</span>'+(p.nutri!==ui.nutri?'<small>de '+NUTRIS[p.nutri]+'</small>':'')+'</button>'}).join('')
    :'<div class="none">No está en la lista. Tocá <b>+</b> para cargarlo.</div>';
  list.hidden=false; input.setAttribute('aria-expanded','true');
  if(q&&all.length)input.setAttribute('aria-activedescendant',input.id+'O0');else input.removeAttribute('aria-activedescendant');
}
/* flechas arriba/abajo para moverse entre las opciones y Enter para elegir */
function pacKey(ev){
  var input=ev.target, list=$('#'+input.id+'L'); if(!list||list.hidden)return;
  var opts=$$('[data-pick]',list); if(!opts.length)return;
  var i=opts.findIndex(function(o){return o.classList.contains('act')});
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
    ev.preventDefault();
    i=ev.key==='ArrowDown'?(i<0?0:Math.min(i+1,opts.length-1)):(i<=0?0:i-1);
    opts.forEach(function(o,k){o.classList.toggle('act',k===i);o.setAttribute('aria-selected',k===i?'true':'false')});
    input.setAttribute('aria-activedescendant',opts[i].id); opts[i].scrollIntoView({block:'nearest'});
  } else if(ev.key==='Enter'&&i>=0){
    ev.preventDefault(); pickPac(input.id,opts[i].dataset.pick);
  }
}
function closeOpts(){$$('.opts').forEach(function(l){l.hidden=true});$$('.pacin').forEach(function(i){i.setAttribute('aria-expanded','false')})}
function pickPac(inputId,pid){var i=$('#'+inputId),p=findPac(pid);if(!i||!p)return;i.value=p.name;i.dataset.pid=p.id;i.classList.add('ok');closeOpts()}
function pidOf(inputId){var i=$('#'+inputId);if(!i)return null;if(i.dataset.pid&&findPac(i.dataset.pid))return i.dataset.pid;var p=paciente(i.value);return p?p.id:null}
function openPacForm(forId,pid){
  var p=pid?findPac(pid):null;
  $('#dlg2').innerHTML=head(p?esc(p.name)+' <button type="button" class="ficha ttl" data-act="fichaDe" data-id="'+p.id+'"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Ficha</button>':'Paciente nuevo','','close2')+
    '<div class="sec"><div class="fields">'+
      '<label class="fld"><span>Nombre</span><input id="qNom" autocomplete="off" value="'+esc(p?p.nombre:'')+'"></label>'+
      '<label class="fld"><span>Apellido</span><input id="qApe" autocomplete="off" value="'+esc(p?p.apellido:'')+'"></label>'+
      '<label class="fld full"><span>Teléfono</span><input id="qTel" inputmode="tel" placeholder="11 1234 5678" value="'+esc(p?p.phone:'')+'"></label>'+
    '</div><span class="lbl">Medio de llegada</span>'+seg('llegada',LLEGADAS.map(function(x){return [x,x]}),p?p.llegada:null)+
    '<div class="fields"><label class="fld full"><span>Notas <em>(opcional)</em></span><input id="qNotas" placeholder="Ej: hijo de…" value="'+esc(p?p.notas:'')+'"></label></div>'+
    '<span class="lbl">Nutricionista</span>'+seg('qNutri',[['fran','Fran'],['car','Car']],p?p.nutri:ui.nutri)+
    '<p class="err" id="qErr" hidden></p><p class="warn" id="qWarn" hidden></p></div>'+
    '<div class="df"><div class="r"><button type="button" class="btn big" data-act="close2">Cancelar</button><button type="button" class="btn big primary" data-act="savePac" data-for="'+(forId||'')+'" data-id="'+(p?p.id:'')+'">Guardar paciente</button></div></div>';
  $('#overlay2').hidden=false;
  if(!isMobile())$('#qNom').focus();
}
function savePac(forId,pid){
  var e=$('#qErr'), nom=$('#qNom').value.trim(), ape=$('#qApe').value.trim(), tel=$('#qTel').value.trim(), lle=segVal('llegada',$('#dlg2'));
  var isNew=!pid, miss=[]; if(!nom)miss.push('nombre'); if(!ape&&isNew)miss.push('apellido'); if(!lle&&isNew)miss.push('medio de llegada');
  if(miss.length){e.textContent='Falta completar: '+miss.join(', ')+'.';e.hidden=false;return}
  var full=(nom+' '+ape).trim(), p=pid?findPac(pid):null;
  e.hidden=true;
  var btn=$('#dlg2 [data-act="savePac"]'), w=$('#qWarn');
  if(!btn.dataset.force){
    var dig=tel.replace(/\D/g,'').slice(-8), nf=norm(full);
    var sameTel=function(x){return dig.length>=6&&(x.phone||'').replace(/\D/g,'').slice(-8)===dig};
    var sim=data.pacientes.filter(function(x){return x!==p&&(norm(x.name)===nf||sameTel(x))});

function dayCol(d){
  var di=iso(d), H=(END-START)/30*ROW, isT=di===iso(today()), inner='', now=new Date();

  var flush=function(){if(!grp.length)return;var cols=[];grp.forEach(function(t){var a=toMin(t.time),c=0;while(cols[c]!=null&&cols[c]>a)c++;cols[c]=a+t.dur;lay[t.id]={c:c}});grp.forEach(function(t){lay[t.id].n=cols.length});grp=[]};

  });
  return '<div class="daycol'+(isT?' today':'')+'" data-date="'+di+'" style="height:'+H+'px" title="Tocá un horario libre para dar un turno">'+inner+'</div>';
}

  var sub=largo(d)+' · '+show(a)+' – '+show(a+t.dur)+(t.tipo?' · '+t.tipo:'');
  var html=head(esc(t.name),esc(cap(sub)));
  html+='<div class="sec"><span class="lbl">Estado del turno</span>'+seg('estadoT',[['p','A confirmar'],['c','Confirmado'],['x','Cancelado']],t.estado,'estado');
  if(link)html+='<a class="wa" href="'+link+'" target="_blank" rel="noopener">'+ICON.wa+'Enviar recordatorio por WhatsApp</a>';
  else html+='<span class="wa off" aria-disabled="true" title="El paciente no tiene teléfono cargado">'+ICON.wa+'Enviar recordatorio por WhatsApp</span>';
  html+='</div>';
  if(pg&&!editPago){
    html+='<div class="sec"><span class="lbl">Pago</span><div class="paid"><span class="pay ok" aria-hidden="true">$</span><div><b>'+money(pg.monto)+'</b> · '+esc(pg.medio)+' · '+ddmm(pg.date)+(pg.fact?' · Facturado':'')+'</div><div class="acts"><button type="button" class="btn" data-act="editPago" data-id="'+t.id+'">Editar</button></div></div></div>';
  } else {
    /* pago como desplegable, igual que "Editar datos del turno" */
    html+='<div class="sec"><details class="edit"'+(pg?' open':'')+'><summary>'+(pg?'Editar pago':'Agregar pago')+'</summary><div class="pform">'+pagoFields(pg,false)+
      '<div class="pbtns">'+(pg?'<button type="button" class="danger" data-act="delPagoT" data-id="'+t.id+'">Quitar pago</button>':'')+
      '<button type="button" class="btn big primary" data-act="savePagoT" data-id="'+t.id+'">'+(pg?'Guardar cambios':'Guardar pago')+'</button></div></div></details></div>';
  }
  html+='<div class="sec"><details class="edit"><summary>Editar datos del turno</summary><div class="fields">'+pacField('eName',p?p.id:null)+'</div>'+
    '<div style="margin-top:12px">'+whenFields('e',t.date,t.time)+'</div>'+
    '<span class="lbl" style="display:block;margin:12px 0 8px">Duración</span>'+seg('eDur',[['30','30 min'],['60','60 min']],String(t.dur))+
    '<span class="lbl" style="display:block;margin:12px 0 8px">Tipo</span>'+seg('eTipo',TIPOS,t.tipo||'')+
    '<div style="margin-top:14px;display:flex;justify-content:flex-end"><button type="button" class="btn big primary" data-act="saveEdit" data-id="'+t.id+'">Guardar cambios</button></div></details></div>';
  html+='<div class="df"><button type="button" class="danger" data-act="delTurno" data-id="'+t.id+'">Borrar turno</button><div class="r"><button type="button" class="btn big" data-act="close">Cerrar</button></div></div>';
  openModal(html);
}
function pagoFields(pg,withName){
  return (withName?'<div class="fields">'+pacField('pName',pg?(pg.pid||(paciente(pg.name)||{}).id):null)+'</div>':'')+
    '<div class="prow2"><span class="lbl">Fecha de pago</span><input id="pDate" class="pdin" type="date" value="'+(pg?pg.date:iso(today()))+'"></div>'+
    (function(){var fijo=pg&&QMONTOS.indexOf(+pg.monto)>=0, mv=pg?(fijo?String(pg.monto):'otro'):null;
      return '<div class="pmontos">'+seg('monto',QMONTOS.map(function(v){return [String(v),money(v)]}),mv,'mseg')+
      '<input id="pMonto" class="pmo'+(mv==='otro'?' on':'')+'" inputmode="numeric" placeholder="Otro" aria-label="Otro importe" value="'+(mv==='otro'?Number(pg.monto).toLocaleString('es-AR'):'')+'"></div>'})()+
    '<div class="prow2"><span class="lbl">Medio de pago</span>'+seg('medio',MEDIOS.map(function(m){return [m,m]}),pg?pg.medio:null)+'</div>'+
    '<p class="err" id="pErr" hidden></p>';
}
function readPago(){
  var e=$('#pErr'), otro=parseInt(String($('#pMonto').value).replace(/\D/g,''),10), mv=segVal('monto'), monto=otro||(mv?+mv:0), medio=segVal('medio'), date=$('#pDate').value;
  if(!monto){e.textContent='Elegí o escribí el monto.';e.hidden=false;return null}
  if(!medio){e.textContent='Elegí el medio de pago.';e.hidden=false;return null}
  if(!date){e.textContent='Elegí la fecha de pago.';e.hidden=false;return null}
  return {monto:monto,medio:medio,date:date};
}

/* Pago suelto (desde Pagos) */
function openPago(id){
  var pg=id?findP(id):null;
  var html=head(pg?'Pago':'Nuevo pago','Pagos de '+NUTRIS[ui.nutri]);
  html+='<div class="sec">'+pagoFields(pg,true)+'<label class="chkline"><input type="checkbox" id="pFact"'+(pg&&pg.fact?' checked':'')+'>Facturado</label></div>';
  html+='<div class="df">'+(pg?'<button type="button" class="danger" data-act="delPago" data-id="'+pg.id+'">Borrar pago</button>':'')+'<div class="r"><button type="button" class="btn big" data-act="close">Cancelar</button><button type="button" class="btn big primary" data-act="savePago" data-id="'+(pg?pg.id:'')+'">Guardar</button></div></div>';
  openModal(html);
}

/* Bloqueo */
function openBloq(id){

    '<div class="sec">'+bloqFields(b)+'<p class="err" id="bErr" hidden></p></div>'+
    '<div class="df"><button type="button" class="danger" data-act="delBloq" data-id="'+b.id+'">Quitar bloqueo</button><div class="r"><button type="button" class="btn big" data-act="close">Cancelar</button><button type="button" class="btn big primary" data-act="saveBloq" data-id="'+b.id+'">Guardar</button></div></div>');
}

/* confirmación en dos toques (sin ventanas del navegador) */
function sure(btn){
  if(btn.classList.contains('sure'))return true;
  btn.dataset.txt=btn.textContent; btn.textContent='¿Seguro? Tocá de nuevo'; btn.classList.add('sure');
  setTimeout(function(){if(btn.isConnected){btn.classList.remove('sure');btn.textContent=btn.dataset.txt}},3000);
  return false;
}

/* ---------- eventos ---------- */
/* ---------- Cobro rápido desde Pagos (fila "Debe") ---------- */
var QMONTOS=[30000,40000,45000,60000,65000];
function closeQp(){var q=$('#qpop');if(q)q.remove();$$('.qd.on').forEach(function(b){b.classList.remove('on')})}
function openQp(btn,tid){
  var t=findT(tid); if(!t)return; closeQp(); btn.classList.add('on');
  var d=document.createElement('div'); d.id='qpop'; d.className='qpop'; d.setAttribute('role','dialog'); d.setAttribute('aria-label','Registrar pago');
  d.innerHTML='<div class="qnm">'+esc(t.name)+' · '+ddmm(t.date)+'</div>'+
    '<div class="qm"><select id="qMonto" aria-label="Monto"><option value="">Monto…</option>'+QMONTOS.map(function(v){return '<option value="'+v+'">'+money(v)+'</option>'}).join('')+'<option value="otro">Otro importe…</option></select></div>'+
    '<select id="qMedio" aria-label="Medio de pago"><option value="">Medio de pago…</option>'+MEDIOS.map(function(m){return '<option>'+m+'</option>'}).join('')+'</select>'+
    '<p class="qerr" id="qErr2" hidden></p>'+
    '<div class="qft"><button type="button" class="qcn" data-act="qcancel">Cancelar</button><button type="button" class="qgo" data-act="qsave" data-id="'+t.id+'">Guardar</button></div>';
  document.body.appendChild(d);
  var r=btn.getBoundingClientRect(), w=d.offsetWidth, left=Math.min(Math.max(8,r.right+scrollX-w+18),scrollX+document.documentElement.clientWidth-w-8);
  d.style.left=left+'px'; d.style.top=(r.bottom+scrollY+9)+'px'; d.style.setProperty('--ax',(r.left+scrollX+r.width/2-left-6)+'px');
  d.addEventListener('input',function(){$('#qErr2').hidden=true});
  $('#qMonto').addEventListener('change',function(){if(this.value==='otro'){$('.qm',d).innerHTML='<input id="qMonto" inputmode="numeric" placeholder="$ monto" aria-label="Monto">';$('#qMonto').focus()}});
}
function saveQp(tid){
  var t=findT(tid), e=$('#qErr2'), raw=String($('#qMonto').value).replace(/[^\d]/g,''), monto=raw?parseInt(raw,10):0, medio=$('#qMedio').value;
  if(!t)return closeQp();
  if(!monto||!medio){e.textContent=!monto&&!medio?'Elegí monto y medio.':!monto?'Elegí el monto.':'Elegí el medio de pago.';e.hidden=false;return}
  if(!pagoDe(t.id))data.pagos.push({id:uid(),nutri:t.nutri,turnoId:t.id,pid:t.pid||null,name:t.name,date:t.date,monto:monto,medio:medio,fact:false});
  closeQp(); save(); render(); toast('Pago registrado');
}
document.addEventListener('click',function(ev){
  var el=ev.target;
  if($('#qpop')&&!el.closest('#qpop')&&!el.closest('.qd'))closeQp();
  var segBtn=el.closest('[data-seg] button');
  if(segBtn){
    var g=segBtn.parentNode;
    $$('button',g).forEach(function(b){b.classList.toggle('on',b===segBtn);b.setAttribute('aria-pressed',b===segBtn)});
    var name=g.dataset.seg;
    if(name==='monto'){var pm=$('#pMonto');pm.value='';pm.classList.remove('on')}
    if(name==='kind'){$('#kTurno').hidden=segBtn.dataset.val!=='turno';$('#kBloq').hidden=segBtn.dataset.val==='turno'}
    if(name==='estadoT'){var t=findT($('[data-act="delTurno"]').dataset.id);if(t){t.estado=segBtn.dataset.val;save();render()}}
    return;
  }
  var pick=el.closest('[data-pick]'); if(pick){pickPac(pick.dataset.for,pick.dataset.pick);return}
  if(!el.closest('.combo'))closeOpts();
  if(el===$('#overlay2')){$('#overlay2').hidden=true;return}
  if(el===$('#overlay')){closeModal();return}
  var tb=el.closest('[data-turno]'); if(tb){openTurno(tb.dataset.turno);return}
  var bb=el.closest('[data-blk]'); if(bb){openBloq(bb.dataset.blk);return}
  var pb=el.closest('[data-pago]'); if(pb){openPago(pb.dataset.pago);return}
  if(el.classList&&el.classList.contains('daycol')){
    var rect=el.getBoundingClientRect(), y=ev.clientY-rect.top, m=START+Math.floor(y/ROW)*30;
    if(m>=START&&m<END)openNuevo(el.dataset.date,hhmm(m));
    return;
  }
  var a=el.closest('[data-act]'); if(!a)return;
  var act=a.dataset.act, id=a.dataset.id, t2, pg, b2, r;
  switch(act){
    case 'view': ui.view=a.dataset.view; ui.plim=null; if(ui.view==='pacientes')ui.ptabla=false; render(); break;
    case 'year': ui.sy=+a.dataset.y; renderStats(); break;
    case 'qpago': if(a.classList.contains('on'))closeQp(); else openQp(a,id); break;
    case 'qcancel': closeQp(); break;
    case 'qsave': saveQp(id); break;
    case 'switch': ui.nutri=OTHER[ui.nutri]; render(); break;
    case 'hoy': ui.date=weekday(today()); render(); break;
    case 'prev': ui.date=addDays(ui.date,-7); render(); break;
    case 'next': ui.date=addDays(ui.date,7); render(); break;
    case 'editPac': openPacForm(null,a.dataset.id); break;
    case 'ptabla': ui.ptabla=!ui.ptabla; ui.plim=null; renderPacientes(); break;
    case 'fichaDe': $('#overlay2').hidden=true; $('#dlg2').innerHTML=''; ui.view='ficha'; ui.fichaId=a.dataset.id; ui.hcEdit=null; render(); window.scrollTo(0,0); break;
    case 'psort': var ck=a.dataset.col; ui.ps=ui.ps&&ui.ps.k===ck?{k:ck,d:-ui.ps.d}:{k:ck,d:1}; ui.plim=200; renderPacientes(); break;
    case 'pmore': ui.plim=(ui.plim||(isAdmin()?200:100))+300; if(isAdmin())renderPacList();else renderPacSimpleList(); break;
    case 'ficha': ui.view='ficha'; ui.fichaId=id; ui.hcEdit=null; ui.fichaTs=null; render(); window.scrollTo(0,0); break;
    case 'fichaVolver': ui.view='pacientes'; render(); break;
    case 'fichaSave': saveFicha(true); break;
    case 'fichaDatos': openPacForm(null,id); break;
    case 'hcNew': saveFicha(false); ui.hcEdit='new'; renderFicha(); var ta=$('#hcText'); if(ta)ta.focus(); break;
    case 'hcEdit': saveFicha(false); ui.hcEdit=id; renderFicha(); break;
    case 'hcCancel': ui.hcEdit=null; renderFicha(); break;
    case 'hcSave': saveHc(); break;
    case 'hcDel': if(!sure(a))break; var hp=findPac(ui.fichaId); hp.historia=(hp.historia||[]).filter(function(h){return h.id!==id}); save(); renderFicha(); break;
    case 'day': ui.date=parse(a.dataset.date); render(); break;
    case 'mhoy': ui.month=new Date(today().getFullYear(),today().getMonth(),1); render(); break;
    case 'nuevo': openNuevo(iso(ui.date),null); break;
    case 'nuevoPago': openPago(null); break;
    case 'close': closeModal(); break;
    case 'saveNuevo': saveNuevo(); break;
    case 'savePhone': t2=findT(id); var ph=$('#tPhone').value.trim(), pp0=t2&&pacDe(t2); if(pp0&&ph){pp0.phone=ph;save();openTurno(id)} break;
    case 'newPac': openPacForm(a.dataset.for); break;
    case 'savePac': savePac(a.dataset.for,a.dataset.id); break;
    case 'close2': $('#overlay2').hidden=true; $('#dlg2').innerHTML=''; break;
    case 'editPago': openTurno(id,true); break;
    case 'savePagoT':
      t2=findT(id); r=readPago(); if(!t2||!r)break;
      pg=pagoDe(t2.id);
      if(pg){pg.monto=r.monto;pg.medio=r.medio;pg.date=r.date}
      else data.pagos.push({id:uid(),nutri:t2.nutri,turnoId:t2.id,name:t2.name,date:r.date,monto:r.monto,medio:r.medio,fact:false});
      save(); render(); openTurno(id); break;
    case 'delPagoT': if(!sure(a))break; pg=pagoDe(id); data.pagos=data.pagos.filter(function(x){return x!==pg}); save(); render(); openTurno(id); break;
    case 'saveEdit':
      t2=findT(id); if(!t2)break;
      var epid=pidOf('eName'), tm=timeVal('eTime','eOther'), dt=$('#eDate').value;
      if(!epid||!tm||!dt){var ee=$('#eName');ee.focus();ee.setCustomValidity&&ee.setCustomValidity('Elegí un paciente de la lista');ee.reportValidity&&ee.reportValidity();break}
      var pp=findPac(epid);
      t2.name=pp.name; t2.pid=pp.id; t2.date=dt; t2.time=tm; t2.dur=+segVal('eDur'); t2.tipo=segVal('eTipo')||'';
      pg=pagoDe(t2.id); if(pg)pg.name=t2.name;
      save(); goTo(dt); openTurno(id); break;
    case 'delTurno': if(!sure(a))break; data.turnos=data.turnos.filter(function(x){return x.id!==id}); data.pagos.forEach(function(x){if(x.turnoId===id)x.turnoId=null}); save(); closeModal(); render(); break;
    case 'savePago':
      var ppid=pidOf('pName');
      if(!ppid){$('#pErr').textContent='Elegí un paciente de la lista, o cargalo con el botón +.';$('#pErr').hidden=false;break}
      r=readPago(); if(!r)break;
      var p3=findPac(ppid);
      pg=id?findP(id):null;
      if(pg){pg.name=p3.name;pg.pid=p3.id;pg.monto=r.monto;pg.medio=r.medio;pg.date=r.date;pg.fact=$('#pFact').checked}
      else data.pagos.push({id:uid(),nutri:ui.nutri,turnoId:null,pid:p3.id,name:p3.name,date:r.date,monto:r.monto,medio:r.medio,fact:$('#pFact').checked});
      var pd=parse(r.date); ui.month=new Date(pd.getFullYear(),pd.getMonth(),1);
      save(); closeModal(); render(); break;
    case 'delPago': if(!sure(a))break; data.pagos=data.pagos.filter(function(x){return x.id!==id}); save(); closeModal(); render(); break;
    case 'saveBloq':
      b2=findB(id); if(!b2)break;
      var rb=readBloq(); if(!rb)break;
      b2.date=rb.date;b2.from=rb.from;b2.to=rb.to;b2.nota=rb.nota;
      save(); closeModal(); goTo(b2.date); break;
    case 'delBloq': if(!sure(a))break; data.bloqueos=data.bloqueos.filter(function(x){return x.id!==id}); save(); closeModal(); render(); break;
    case 'logout': auth.signOut(); break;
    case 'forgot': var fm=$('#lMail').value.trim(); if(!fm){$('#lErr').textContent='Escribí tu mail arriba y tocá de nuevo.';$('#lErr').hidden=false;break}
      auth.sendPasswordResetEmail(fm).then(function(){$('#lErr').textContent='Te mandamos un mail para cambiar la contraseña.';$('#lErr').hidden=false}).catch(function(){$('#lErr').textContent='No se pudo enviar el mail. Revisá que esté bien escrito.';$('#lErr').hidden=false}); break;
  }
});
function prevWeekday(d){var x=addDays(d,-1);while(x.getDay()===0||x.getDay()===6)x=addDays(x,-1);return x}

document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.pauta){var pp2=findPac(el.dataset.pauta);if(pp2){pp2.pauta=el.checked;save()}return}
  if(el.dataset&&el.dataset.fact){var p=findP(el.dataset.fact);if(p){p.fact=el.checked;save();render()}return}
  if(el.classList&&el.classList.contains('stin')){saveStat(el);return}
  if(el.id==='pMes'||el.id==='pAnio'){ui.month=new Date(+$('#pAnio').value,+$('#pMes').value,1);render();return}

  if(el.id==='eTime')$('#eOther').value='';
});
document.addEventListener('input',function(ev){

});
document.addEventListener('focusin',function(ev){var el=ev.target;if(el.classList&&el.classList.contains('pacin')&&!el.dataset.pid)pacOptions(el)});
/* Guía al pasar el mouse por la agenda (PC): resalta la hora a la izquierda, una línea en toda la fila y el casillero libre */
var hovIdx=-1;
function clearHover(){hovIdx=-1;$$('.tm.hov').forEach(function(x){x.classList.remove('hov')});var g=$('#hovRow');if(g)g.remove();var gh=$('#hovGhost');if(gh)gh.remove()}
document.addEventListener('input',function(ev){
  if(ev.target.id!=='pMonto'||!ev.target.classList.contains('pmo'))return;
  var v=ev.target.value.replace(/\D/g,''); ev.target.value=v?Number(v).toLocaleString('es-AR'):'';
  ev.target.classList.toggle('on',!!v);
  if(v)$$('[data-seg="monto"] button').forEach(function(b){b.classList.remove('on');b.setAttribute('aria-pressed','false')});
});
document.addEventListener('mousemove',function(ev){
  if(ui.view!=='agenda'||isMobile())return;
  var col=ev.target.closest&&ev.target.closest('.daycol');
  if(!col){if(hovIdx>=0)clearHover();return}
  var r=col.getBoundingClientRect(), idx=Math.floor((ev.clientY-r.top)/ROW), n=(END-START)/30;
  if(idx<0||idx>=n){clearHover();return}
  var onEmpty=ev.target===col, key=idx+'|'+col.dataset.date+'|'+onEmpty;
  if(key===hovIdx)return; clearHover(); hovIdx=key;
  var tms=$$('.times .tm'); if(tms[idx])tms[idx].classList.add('hov');
  var grid=col.parentNode, gr=grid.getBoundingClientRect(), line=document.createElement('div');
  line.id='hovRow'; line.style.top=(r.top-gr.top+idx*ROW)+'px'; line.style.height=ROW+'px'; grid.appendChild(line);
  if(onEmpty){var g=document.createElement('div');g.id='hovGhost';g.style.top=(idx*ROW+2)+'px';g.style.height=(ROW-4)+'px';g.textContent='+ '+show(START+idx*30);col.appendChild(g)}
});
document.addEventListener('mouseleave',clearHover);
document.addEventListener('keydown',function(ev){
  if(ev.target.classList&&ev.target.classList.contains('pacin')&&/^(ArrowDown|ArrowUp|Enter)$/.test(ev.key)){pacKey(ev);return}
  if(ev.key!=='Escape')return;
  if($$('.opts').some(function(l){return !l.hidden})){closeOpts();return}
  if(!$('#overlay2').hidden){$('#overlay2').hidden=true;return}
  if(!$('#overlay').hidden)closeModal();
});
var mq=window.matchMedia('(max-width:760px)');
if(mq.addEventListener)mq.addEventListener('change',render);else if(mq.addListener)mq.addListener(render);
setInterval(function(){if(staff&&ui.view==='agenda'&&!busy())render()},60000);

document.addEventListener('submit',function(ev){
  if(ev.target.id!=='lForm')return; ev.preventDefault();
  var m=$('#lMail').value.trim(), p=$('#lPass').value, b=$('#lBtn'), e=$('#lErr');
  if(!m||!p){e.textContent='Completá mail y contraseña.';e.hidden=false;return}

  auth.signInWithEmailAndPassword(m,p).catch(function(err){
    var c=err.code||'';
    showLogin(/wrong-password|invalid-credential|user-not-found|invalid-email|invalid-login/.test(c)?'Mail o contraseña incorrectos.':c==='auth/too-many-requests'?'Demasiados intentos. Esperá unos minutos.':'No se pudo ingresar. Revisá la conexión.');
  });
});

})();
