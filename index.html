<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F5F1">
<title>Lado B · Consultorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17201B; --muted:#56605A; --soft:#6B746E; --line:#DDE1DA; --line2:#E6E9E4; --grid:#EEF0EC;
  --bg:#F4F5F1; --card:#fff; --lima:#D4FF3A;
  --conf:#FFE7A3; --canc:#F9D3CE; --cancInk:#7A2E25; --pendLine:#A3862A; --bloq:#DCE4E8; --bloqInk:#3E4E57;
  --ok:#2E7D3E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:'Archivo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:1440px;margin:0 auto;padding:18px 28px 28px;display:flex;flex-direction:column;gap:12px}

/* Encabezado */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"nav logo who";align-items:center;gap:16px}
.nav{grid-area:nav;display:flex;gap:4px}
.nav button{border:0;background:transparent;font-size:13px;font-weight:600;color:#3D4741;height:34px;padding:0 12px;border-radius:8px;cursor:pointer}
.nav button:hover{background:#E6E9E2}
.nav button.on{background:var(--ink);color:#fff}
.logo{grid-area:logo;font-weight:900;font-size:26px;letter-spacing:-0.02em;text-align:center;line-height:1}
.logo span{background:var(--lima);padding:0 7px;margin-left:5px}
.who{grid-area:who;display:flex;align-items:center;gap:12px;justify-content:flex-end;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-0.01em}
.btn{font-size:13px;font-weight:600;height:36px;padding:0 14px;border-radius:8px;border:1px solid #C9CFC8;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#9AA39C}
.btn.icon{width:36px;padding:0}
.btn.pill{border-radius:999px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2A352F}
.row2{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.period{font-weight:800;font-size:17px;min-width:170px;text-align:center}

/* Agenda */
.board{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid{display:grid;min-width:900px}
.corner{border-bottom:1px solid var(--line)}
.dayhead{padding:10px 12px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.dn{font-weight:700;font-size:14px}
.num{font-weight:800;font-size:20px}
.cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.dayhead.today .num{background:var(--lima);border-radius:6px;padding:0 6px}
.times{display:flex;flex-direction:column}
.tm{height:30px;font-size:10.5px;color:var(--soft);text-align:right;padding:4px 8px 0 0;font-variant-numeric:tabular-nums}
.tm.full{color:var(--ink);font-weight:600}
.daycol{position:relative;border-left:1px solid var(--line2);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0 29px,var(--grid) 29px 30px)}
.daycol.today{background-color:#FBFDF1}
.daycol:hover{background-color:#FAFBF8}
.daycol.today:hover{background-color:#F7FBE6}
.now{position:absolute;left:0;right:0;height:2px;background:#E2462F;z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#E2462F}
.ev,.blk{position:absolute;left:3px;width:calc(100% - 6px);z-index:2;justify-content:flex-start;border:0;border-radius:4px;text-align:left;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:11.5px;cursor:pointer;overflow:hidden}
.ev:hover,.blk:hover{box-shadow:inset 0 0 0 1.5px rgba(23,32,27,.55)}
.ev:focus-visible,.blk:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.ev .t{flex:none;width:28px;font-size:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .nm{text-align:left;flex:1 1 auto;min-width:0;font-weight:500;line-height:1.08;overflow-wrap:anywhere}
.ev .meta{flex:none;margin-left:auto;display:flex;gap:4px;align-items:center}
.tag{font-size:9.5px;font-weight:800;padding:1px 4px;border-radius:3px;background:rgba(23,32,27,.12)}
.ev.c{background:var(--conf)}
.ev.x{background:var(--canc)}
.ev.x .nm{text-decoration:line-through;color:var(--cancInk)}
.ev.p{background:#fff;border:1.5px dashed var(--pendLine)}
.pay{flex:none;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.pay.ok{background:var(--ok);color:#fff}
.pay.no{border:1.5px solid #8A938D;color:#6B746E;background:rgba(255,255,255,.5)}
.blk{background-color:var(--bloq);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.55) 6px 9px);justify-content:center;color:var(--bloqInk)}
.blk.tall{flex-direction:column;gap:2px}
.blk .bl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.blk .blr{font-size:11px}
.blk .bln{font-size:12px;font-weight:600;background:#fff;padding:1px 6px;border-radius:3px;margin-top:3px;max-width:100%;text-align:center}
.tabs{display:none}
.fab{display:none}

/* Pagos */
.col{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.col{max-width:760px}
.totals{display:flex;justify-content:center;gap:10px}
.tot{flex:0 1 287px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;gap:2px}
.tot span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tot span em{font-style:normal;text-transform:none;letter-spacing:0;margin-left:4px}
.tot b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.tot small{font-size:12px;color:var(--muted)}
.tot.hi{background:var(--ink);border-color:var(--ink);color:#fff}
.tot.hi span,.tot.hi small{color:#C9D1CB}
.tot.fc{background:var(--lima);border-color:var(--lima)}
.tot.fc span,.tot.fc small{color:#2C3A0A}
.table{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thead,.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 100px 128px 72px;align-items:center;column-gap:12px;padding:0 16px}
.prow{border-top:1px solid #F0F2EE}
.table .prow:nth-child(2){border-top:0}
.pdate{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.thead{height:38px;background:#F6F7F3;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.r{text-align:right}.c{text-align:center}
.dayrow{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 6px;border-top:1px solid var(--line2)}
.table .dayrow:nth-child(2){border-top:0}
.dayrow b{font-size:14px;font-weight:800}
.dayrow span{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.prow{min-height:42px;font-size:13.5px}
.prow:hover{background:#FAFBF7}
.pname{border:0;background:transparent;text-align:left;padding:8px 0;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.pname:hover span:first-child{text-decoration:underline}
.amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chip{justify-self:start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF0EA;color:#3D4741;white-space:nowrap}
.chip.mp{background:#E3EEFB;color:#1F4B7A}
.chip.ef{background:#E9F5DA;color:#2C4A12}
.chip.tj{background:#F1E6FA;color:#55267A}
.ck{justify-self:center;display:flex;align-items:center;justify-content:center;width:44px;height:42px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--ink);cursor:pointer;margin:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
.foot button{border:0;background:none;color:#2F5D3A;text-decoration:underline;cursor:pointer;font-size:12px;padding:4px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(23,32,27,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay[hidden]{display:none}
.dlg{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dh{padding:20px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2)}
.dh h2{margin:0;font-size:21px;font-weight:800;line-height:1.15}
.dh p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.xbtn{flex:none;width:40px;height:40px;border:0;background:#F1F2EE;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sec{padding:16px 22px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line2)}
.sec:last-of-type{border-bottom:0}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg button{font-size:13.5px;font-weight:600;height:42px;border:1px solid #C9CFC8;border-radius:8px;background:#fff;cursor:pointer;padding:0 6px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.estado button.on[data-val="c"]{background:var(--conf);border-color:#E0B12A;color:var(--ink)}
.seg.estado button.on[data-val="p"]{background:#fff;border:1.5px dashed var(--pendLine);color:var(--ink)}
.seg.estado button.on[data-val="x"]{background:var(--canc);border-color:#E3A097;color:var(--cancInk)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:13px;font-weight:600}
.fld>span em{font-style:normal;font-weight:500;color:var(--muted)}
.fld input,.fld select{font:inherit;font-size:15px;font-weight:500;height:44px;border:1px solid #C9CFC8;border-radius:8px;padding:0 12px;width:100%;color:var(--ink);background:#fff;min-width:0}
.fld input:focus,.fld select:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.err{margin:0;color:#A12F22;font-size:13px;font-weight:600}
[hidden]{display:none!important}
.fields.three{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}
.pacrow{display:flex;gap:8px;align-items:stretch}
.combo{position:relative;flex:1;min-width:0}
.combo input{font:inherit;font-size:15px;font-weight:500;height:44px;border:1px solid #C9CFC8;border-radius:8px;padding:0 12px;width:100%;color:var(--ink);background:#fff}
.combo input:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.combo input.ok{border-color:#7BA319;background:#FAFDF2}
.opts{position:absolute;left:0;right:0;top:48px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px rgba(23,32,27,.15);max-height:260px;overflow:auto;padding:4px}
.opts button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;padding:10px 10px;border-radius:6px;font-size:14px;cursor:pointer;min-height:40px}
.opts button:hover,.opts button:focus{background:#F1F2EE;outline:0}
.opts button small{font-size:11.5px;color:var(--muted);white-space:nowrap}
.opts .none{padding:10px;font-size:13px;color:var(--muted)}
.addpac{flex:none;width:44px;height:44px;border-radius:8px;border:0;background:var(--ink);color:var(--lima);display:flex;align-items:center;justify-content:center;cursor:pointer}
#overlay2{z-index:60}
.wa{font-size:13.5px;font-weight:600;height:44px;border:1px solid #B9DDB0;background:#EEF8EA;color:#1D4D17;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none}
.wa:hover{background:#E2F3DC}
.paid{display:flex;align-items:center;gap:10px;background:#EEF8EA;border:1px solid #B9DDB0;border-radius:10px;padding:12px 14px;font-size:14px}
.paid b{font-weight:800}
.paid .pay{width:22px;height:22px;font-size:13px}
.paid .acts{margin-left:auto;display:flex;gap:6px}
.df{padding:14px 22px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line2)}
.df .r{display:flex;gap:8px;margin-left:auto}
.btn.big{height:44px;padding:0 18px;font-size:13.5px}
.danger{border:0;background:transparent;color:#A12F22;font-weight:600;font-size:13.5px;height:44px;padding:0 8px;cursor:pointer}
.danger.sure{background:#A12F22;color:#fff;border-radius:8px;padding:0 14px}
details.edit summary{cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;display:flex;align-items:center;gap:6px}
details.edit summary::-webkit-details-marker{display:none}
details.edit summary::before{content:"›";display:inline-block;transition:transform .15s;font-size:18px;line-height:1}
details.edit[open] summary::before{transform:rotate(90deg)}
details.edit[open] summary{margin-bottom:12px}
.chkline{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
.chkline input{width:20px;height:20px;accent-color:var(--ink);margin:0}

/* Celular */
@media (max-width:760px){
  .app{padding:12px 12px 90px;gap:10px}
  .top{grid-template-columns:1fr auto;grid-template-areas:"logo logo" "who who" "nav nav";gap:10px}
  .logo{font-size:22px}
  .who{justify-content:space-between}
  h1{font-size:18px}
  .nav{background:#E9EBE5;border-radius:10px;padding:3px}
  .nav button{flex:1;height:36px}
  .row2 .desk{display:none}
  .period{min-width:0;flex:1;font-size:15px}
  .row2{flex-wrap:nowrap;gap:6px}
  .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
  .tab{border:0;background:#E9EBE5;border-radius:8px;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#3D4741;position:relative;cursor:pointer}
  .tab b{font-size:16px;font-weight:800;color:var(--ink)}
  .tab span{font-size:11px;font-weight:600}
  .tab.on{background:var(--ink);color:#fff}
  .tab.on b{color:var(--lima)}
  .tab i{position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:50%;background:#7BA319}
  .grid{min-width:0}
  .ev{font-size:13px;padding:0 8px;gap:6px}
  .ev .t{width:32px;font-size:11px}
  .tm{padding-right:6px}
  .fab{display:flex;position:fixed;right:18px;bottom:22px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--lima);align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(23,32,27,.3);z-index:20;cursor:pointer}
  .tot{flex:1 1 0;min-width:0;padding:10px 12px}
  .tot b{font-size:21px}
  .thead{display:none}
  .prow{grid-template-columns:40px minmax(0,1fr) auto 44px;grid-template-areas:"d n n k" "d a m k";padding:6px 12px;row-gap:2px}
  .prow .pdate{grid-area:d}
  .prow .pname{grid-area:n;padding:4px 0 0}
  .fields.three{grid-template-columns:1fr 1fr}
  .fields.three .fld:first-child{grid-column:1/-1}
  .prow .amt{grid-area:a;text-align:left}
  .prow .chip{grid-area:m;justify-self:end}
  .prow .ck{grid-area:k;width:44px}
  .dayrow{padding:12px 12px 4px}
  .overlay{align-items:flex-end;padding:0}
  .dlg{max-width:none;border-radius:16px 16px 0 0;max-height:92vh}
  .fields{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <nav class="nav" aria-label="Secciones">
      <button type="button" data-act="view" data-view="agenda">Agenda</button>
      <button type="button" data-act="view" data-view="pagos">Pagos</button>
    </nav>
    <div class="logo" aria-label="Lado B">LADO<span>B</span></div>
    <div class="who">
      <h1 id="title">Agenda de Fran</h1>
      <button type="button" class="btn pill" id="switchBtn" data-act="switch"></button>
    </div>
  </header>
  <div class="row2" id="row2"></div>
  <main id="main"></main>
  <p class="foot">Versión de prueba: los datos son de ejemplo y se guardan solo en este navegador. <button type="button" data-act="reset">Restablecer ejemplo</button></p>
</div>
<div class="overlay" id="overlay" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="overlay2" hidden><div class="dlg" id="dlg2" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';
var NUTRIS={fran:'Fran',car:'Car'}, OTHER={fran:'car',car:'fran'};
var START=8*60, END=21*60, ROW=30;
var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var DCORTO=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MEDIOS=['Efectivo','Mercado Pago','Tarjeta'];
var MEDIO_CLS={'Efectivo':'ef','Mercado Pago':'mp','Tarjeta':'tj'};
var TIPOS=[['','Consulta'],['InBody','InBody'],['Virtual','Virtual']];
var KEY='ladob_data_v2', UIKEY='ladob_ui_v1';
var LLEGADAS=['Google','Instagram','Referido','Otro'];
var ICON={
  prev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  plusBig:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  swap:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-4-4"/><path d="M20 16H6l4 4"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  wa:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.5 7.8L3 21l1.3-4.4A9 9 0 1 1 21 12z"/></svg>'
};

/* ---------- utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){var x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function weekday(d){var x=new Date(d);while(x.getDay()===0||x.getDay()===6)x=addDays(x,1);return x}
function toMin(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
function show(m){return Math.floor(m/60)+':'+pad(m%60)}
function hhmm(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function money(n){return '$ '+Number(n||0).toLocaleString('es-AR')}
function ddmm(s){var p=s.split('-');return p[2]+'/'+p[1]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function largo(d){return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]}
function isMobile(){return window.matchMedia('(max-width:760px)').matches}
function norm(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}

/* ---------- consultas ---------- */
function turnosDe(n,di){return data.turnos.filter(function(t){return t.nutri===n&&t.date===di}).sort(function(a,b){return toMin(a.time)-toMin(b.time)})}
function bloqueosDe(n,di){return data.bloqueos.filter(function(b){return b.nutri===n&&b.date===di})}
function pagoDe(tid){for(var i=0;i<data.pagos.length;i++)if(data.pagos[i].turnoId===tid)return data.pagos[i];return null}
function findT(id){return data.turnos.find(function(t){return t.id===id})}
function findP(id){return data.pagos.find(function(p){return p.id===id})}
function findB(id){return data.bloqueos.find(function(b){return b.id===id})}
function findPac(id){return data.pacientes.find(function(p){return p.id===id})}
function paciente(name){var k=norm(name);return data.pacientes.find(function(p){return norm(p.name)===k})}
function pacDe(t){return (t.pid&&findPac(t.pid))||paciente(t.name)}
/* Selector de paciente: solo se puede elegir de la lista; "+" para cargar uno nuevo */

}
function pacOptions(input){
  var q=norm(input.value), list=$('#'+input.id+'L');
  var all=data.pacientes.filter(function(p){return !q||norm(p.name).indexOf(q)>-1});
  all.sort(function(a,b){var x=(a.nutri===ui.nutri?0:1)-(b.nutri===ui.nutri?0:1);return x||a.name.localeCompare(b.name)});
  all=all.slice(0,8);
  list.innerHTML=all.length?all.map(function(p){return '<button type="button" role="option" data-pick="'+p.id+'" data-for="'+input.id+'"><span>'+esc(p.name)+'</span>'+(p.nutri!==ui.nutri?'<small>de '+NUTRIS[p.nutri]+'</small>':'')+'</button>'}).join('')
    :'<div class="none">No está en la lista. Tocá <b>+</b> para cargarlo.</div>';
  list.hidden=false; input.setAttribute('aria-expanded','true');
}

function savePac(forId){
  var e=$('#qErr'), nom=$('#qNom').value.trim(), ape=$('#qApe').value.trim(), tel=$('#qTel').value.trim(), lle=segVal('llegada',$('#dlg2'));
  var miss=[]; if(!nom)miss.push('nombre'); if(!ape)miss.push('apellido'); if(!tel)miss.push('teléfono'); if(!lle)miss.push('medio de llegada');
  if(miss.length){e.textContent='Falta completar: '+miss.join(', ')+'.';e.hidden=false;return}
  var full=nom+' '+ape;
  if(paciente(full)){e.textContent='Ya existe un paciente con ese nombre. Buscalo en la lista.';e.hidden=false;return}
  var p={id:uid(),nombre:nom,apellido:ape,name:full,phone:tel,llegada:lle,notas:$('#qNotas').value.trim(),nutri:ui.nutri};
  data.pacientes.push(p); save();
  $('#overlay2').hidden=true; $('#dlg2').innerHTML='';
  pickPac(forId,p.id);
}
function waLink(t){
  var p=pacDe(t); if(!p||!p.phone)return null;
  var num=p.phone.replace(/\D/g,'');
  if(num.indexOf('54')!==0){ if(num.indexOf('0')===0)num=num.slice(1); num='549'+num; }
  var d=parse(t.date);
  var msg='¡Hola '+t.name.split(' ')[0]+'! Te recordamos tu turno en Lado B Nutrición el '+DIAS[d.getDay()].toLowerCase()+' '+d.getDate()+' de '+MESES[d.getMonth()]+' a las '+show(toMin(t.time))+' hs con '+NUTRIS[t.nutri]+'. Charcas 3331. ¡Te esperamos!';
  return 'https://wa.me/'+num+'?text='+encodeURIComponent(msg);
}

/* ---------- render ---------- */
function render(){
  $$('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.view===ui.view);b.setAttribute('aria-current',b.dataset.view===ui.view?'page':'false')});
  var N=NUTRIS[ui.nutri], O=NUTRIS[OTHER[ui.nutri]];
  $('#title').textContent=(ui.view==='agenda'?'Agenda de ':'Pagos de ')+N;
  $('#switchBtn').innerHTML=ICON.swap+(ui.view==='agenda'?'Ver agenda de ':'Ver pagos de ')+O;
  document.title=(ui.view==='agenda'?'Agenda':'Pagos')+' de '+N+' · Lado B';
  if(ui.view==='agenda')renderAgenda();else renderPagos();
  saveUi();
}

function weekLabel(ws){
  var we=addDays(ws,4);
  if(ws.getMonth()===we.getMonth())return ws.getDate()+' – '+we.getDate()+' '+MESES[ws.getMonth()].slice(0,3)+' '+we.getFullYear();
  return ws.getDate()+' '+MESES[ws.getMonth()].slice(0,3)+' – '+we.getDate()+' '+MESES[we.getMonth()].slice(0,3)+' '+we.getFullYear();
}

function renderAgenda(){
  var mob=isMobile(), ws=monday(ui.date);
  var days=mob?[ui.date]:[0,1,2,3,4].map(function(i){return addDays(ws,i)});
  var label=mob?largo(ui.date):weekLabel(ws);
  $('#row2').innerHTML='<button type="button" class="btn" data-act="hoy">Hoy</button>'+
    '<button type="button" class="btn icon" data-act="prev" aria-label="'+(mob?'Día anterior':'Semana anterior')+'">'+ICON.prev+'</button>'+
    '<span class="period">'+esc(label)+'</span>'+
    '<button type="button" class="btn icon" data-act="next" aria-label="'+(mob?'Día siguiente':'Semana siguiente')+'">'+ICON.next+'</button>'+
    '<button type="button" class="btn primary desk" data-act="nuevo">'+ICON.plus+'Nuevo turno</button>';
  var td=iso(today()), html='';
  if(mob){
    html+='<div class="tabs" role="tablist" aria-label="Días">';
    for(var i=0;i<5;i++){var d=addDays(ws,i),di=iso(d);
      html+='<button type="button" role="tab" class="tab'+(di===iso(ui.date)?' on':'')+'" data-act="day" data-date="'+di+'" aria-selected="'+(di===iso(ui.date))+'"><span>'+DCORTO[d.getDay()]+'</span><b>'+d.getDate()+'</b>'+(di===td?'<i aria-label="hoy"></i>':'')+'</button>';}
    html+='</div>';
  }
  html+='<div class="board"><div class="grid" style="grid-template-columns:'+(mob?'46px':'56px')+' repeat('+days.length+',minmax(0,1fr))">';
  html+='<div class="corner"></div>';
  days.forEach(function(d){
    var di=iso(d), n=turnosDe(ui.nutri,di).filter(function(t){return t.estado!=='x'}).length;
    html+='<div class="dayhead'+(di===td?' today':'')+'"><span class="dn">'+(mob?DIAS[d.getDay()]:DIAS[d.getDay()])+'</span><span class="num">'+d.getDate()+'</span><span class="cnt">'+n+' turno'+(n===1?'':'s')+'</span></div>';
  });
  html+='<div class="times">';
  for(var m=START;m<END;m+=30)html+='<div class="tm'+(m%60===0?' full':'')+'">'+show(m)+'</div>';
  html+='</div>';
  days.forEach(function(d){html+=dayCol(d)});
  html+='</div></div>';
  if(mob)html+='<button type="button" class="fab" data-act="nuevo" aria-label="Nuevo turno">'+ICON.plusBig+'</button>';
  $('#main').innerHTML=html;
}

function dayCol(d){
  var di=iso(d), H=(END-START)/30*ROW, isT=di===iso(today()), inner='', now=new Date();
  if(isT){var nm=now.getHours()*60+now.getMinutes(); if(nm>=START&&nm<=END)inner+='<div class="now" style="top:'+((nm-START)/30*ROW)+'px" aria-hidden="true"></div>';}
  bloqueosDe(ui.nutri,di).forEach(function(b){
    var a=toMin(b.from), z=toMin(b.to), top=(a-START)/30*ROW+2, h=(z-a)/30*ROW-4, tall=h>40;
    inner+='<button type="button" class="blk'+(tall?' tall':'')+'" data-blk="'+b.id+'" style="top:'+top+'px;height:'+h+'px"><span class="bl">Bloqueado</span>'+(tall?'<span class="blr">'+show(a)+' – '+show(z)+'</span>':'')+(b.nota?'<span class="bln">'+esc(b.nota)+'</span>':'')+'</button>';
  });
  turnosDe(ui.nutri,di).forEach(function(t){
    var m=toMin(t.time), top=(m-START)/30*ROW+2, h=t.dur/30*ROW-4, pg=pagoDe(t.id), pay='';
    var when=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,m);
    if(t.estado==='c'){ if(pg)pay='<span class="pay ok" title="Pagado" aria-label="Pagado">$</span>'; else if(when<=now)pay='<span class="pay no" title="Sin pagar" aria-label="Sin pagar">$</span>'; }
    inner+='<button type="button" class="ev '+t.estado+'" data-turno="'+t.id+'" style="top:'+top+'px;height:'+h+'px"><span class="t">'+show(m)+'</span><span class="nm">'+esc(t.name)+'</span><span class="meta">'+(t.tipo?'<span class="tag">'+esc(t.tipo)+'</span>':'')+pay+'</span></button>';
  });
  return '<div class="daycol'+(isT?' today':'')+'" data-date="'+di+'" style="height:'+H+'px" title="Tocá un horario libre para dar un turno">'+inner+'</div>';
}

function renderPagos(){
  var y=ui.month.getFullYear(), mo=ui.month.getMonth();
  $('#row2').innerHTML='<button type="button" class="btn icon" data-act="mprev" aria-label="Mes anterior">'+ICON.prev+'</button>'+
    '<span class="period">'+cap(MESES[mo])+' '+y+'</span>'+
    '<button type="button" class="btn icon" data-act="mnext" aria-label="Mes siguiente">'+ICON.next+'</button>'+
    '<button type="button" class="btn primary" data-act="nuevoPago">'+ICON.plus+'Pago</button>';
  var pref=y+'-'+pad(mo+1)+'-';
  var list=data.pagos.filter(function(p){return p.nutri===ui.nutri&&p.date.indexOf(pref)===0}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  var tot=0,tf=0,cf=0; list.forEach(function(p){tot+=+p.monto;if(p.fact){tf+=+p.monto;cf++}});
  var html='<div class="col"><div class="totals">'+
    '<div class="tot hi"><span>Total del mes<em>('+list.length+')</em></span><b>'+money(tot)+'</b></div>'+
    '<div class="tot fc"><span>Facturado</span><b>'+money(tf)+'</b></div></div>';
  html+='<div class="table"><div class="thead"><span>Fecha</span><span>Paciente</span><span class="r">Monto</span><span>Medio</span><span class="c">Fact.</span></div>';
  if(!list.length)html+='<div class="empty">No hay pagos cargados en '+MESES[mo]+'. Se cargan desde la agenda, tocando el turno del paciente.</div>';
  list.forEach(function(p){
    var t=p.turnoId?findT(p.turnoId):null;
    html+='<div class="prow"><span class="pdate">'+ddmm(p.date)+'</span><button type="button" class="pname" data-pago="'+p.id+'"><span>'+esc(p.name)+'</span>'+(t&&t.tipo?'<span class="tag">'+esc(t.tipo)+'</span>':'')+'</button>'+
      '<span class="amt">'+money(p.monto)+'</span><span class="chip '+(MEDIO_CLS[p.medio]||'')+'">'+esc(p.medio)+'</span>'+
      '<label class="ck"><input type="checkbox" data-fact="'+p.id+'"'+(p.fact?' checked':'')+' aria-label="Facturado: '+esc(p.name)+'"></label></div>';
  });
  html+='</div></div>';
  $('#main').innerHTML=html;
}

  var half=time&&toMin(time)%30===0, sel=half?time:hhmm(Math.floor(toMin(time||'09:00')/30)*30);
  return '<div class="fields three">'+
    '<label class="fld"><span>Fecha</span><input id="'+p+'Date" type="date" value="'+date+'"></label>'+
    '<label class="fld"><span>Hora</span>'+slotSelect(p+'Time',sel)+'</label>'+
    '<label class="fld"><span>Otra hora</span><input id="'+p+'Other" type="time" step="300" value="'+(half?'':(time||''))+'"></label></div>';
}

/* Nuevo turno / bloqueo */
function openNuevo(di,time){
  var d=di||iso(ui.date), t=time||'09:00';
  openModal(head('Nuevo','Agenda de '+NUTRIS[ui.nutri])+
    '<div class="sec">'+seg('kind',[['turno','Turno'],['bloqueo','Bloqueo']],'turno')+'</div>'+
    '<div class="sec" id="kTurno"><div class="fields">'+pacField('nName',null)+'</div>'+
      whenFields('n',d,t)+
    '<span class="lbl">Duración</span>'+seg('dur',[['30','30 min'],['60','60 min']],'30')+
    '<span class="lbl">Tipo</span>'+seg('tipo',TIPOS,'')+
    '<span class="lbl">Estado</span>'+seg('estado',[['p','A confirmar'],['c','Confirmado']],'p','estado')+
    '<p class="err" id="nErr" hidden></p></div>'+
    '<div class="sec" id="kBloq" hidden>'+bloqFields(null,d,t)+'<p class="err" id="bErr" hidden></p></div>'+
    '<div class="df"><div class="r"><button type="button" class="btn big" data-act="close">Cancelar</button><button type="button" class="btn big primary" data-act="saveNuevo">Guardar</button></div></div>');
}
function bloqFields(b,d,t){
  return '<div class="fields">'+
    '<label class="fld full"><span>Detalle <em>(opcional)</em></span><input id="bNota" placeholder="Ej: Congreso, feriado…" value="'+esc(b?b.nota:'')+'"></label>'+
    '<label class="fld full"><span>Fecha</span><input id="bDate" type="date" value="'+(b?b.date:d)+'"></label>'+
    '<label class="fld"><span>Desde</span>'+slotSelect('bFrom',b?b.from:t)+'</label>'+
    '<label class="fld"><span>Hasta</span>'+endSelect('bTo',b?b.to:hhmm(Math.min(toMin(t)+60,END)))+'</label></div>';
}
function readBloq(){
  var a=$('#bFrom').value, z=$('#bTo').value, err=$('#bErr');
  if(!$('#bDate').value){err.textContent='Elegí la fecha.';err.hidden=false;return null}
  if(toMin(z)<=toMin(a)){err.textContent='El horario "hasta" tiene que ser después de "desde".';err.hidden=false;return null}
  return {date:$('#bDate').value,from:a,to:z,nota:$('#bNota').value.trim()};
}
function saveNuevo(){
  if(segVal('kind')==='bloqueo'){
    var b=readBloq(); if(!b)return;
    b.id=uid(); b.nutri=ui.nutri; data.bloqueos.push(b);
    save();closeModal();goTo(b.date);return;
  }
  var pid=pidOf('nName'), e=$('#nErr'), time=timeVal('nTime','nOther'), date=$('#nDate').value;
  if(!pid){e.textContent='Elegí un paciente de la lista, o cargalo con el botón +.';e.hidden=false;return}
  if(!date){e.textContent='Elegí la fecha.';e.hidden=false;return}
  if(!time){e.textContent='Elegí la hora.';e.hidden=false;return}
  var p=findPac(pid);
  data.turnos.push({id:uid(),nutri:ui.nutri,date:date,time:time,dur:+segVal('dur'),name:p.name,pid:p.id,tipo:segVal('tipo')||'',estado:segVal('estado')});
  save();closeModal();goTo(date);
}
function goTo(di){var d=parse(di);if(d.getDay()!==0&&d.getDay()!==6)ui.date=d;render()}

/* Detalle de turno */
function openTurno(id,editPago){
  var t=findT(id); if(!t)return;
  var d=parse(t.date), a=toMin(t.time), pg=pagoDe(t.id), p=pacDe(t), link=waLink(t);
  var sub=largo(d)+' · '+show(a)+' – '+show(a+t.dur)+(t.tipo?' · '+t.tipo:'');
  var html=head(esc(t.name),esc(cap(sub)));
  html+='<div class="sec"><span class="lbl">Estado del turno</span>'+seg('estadoT',[['c','Confirmado'],['p','A confirmar'],['x','Cancelado']],t.estado,'estado');
  if(link)html+='<a class="wa" href="'+link+'" target="_blank" rel="noopener">'+ICON.wa+'Enviar recordatorio por WhatsApp</a>';
  else html+='<div class="fields"><label class="fld full"><span>Teléfono <em>(para mandar el recordatorio)</em></span><input id="tPhone" inputmode="tel" placeholder="11 1234 5678"></label></div><button type="button" class="btn big" data-act="savePhone" data-id="'+t.id+'">Guardar teléfono</button>';
  html+='</div>';
  html+='<div class="sec"><span class="lbl">Pago</span>';
  if(pg&&!editPago){
    html+='<div class="paid"><span class="pay ok" aria-hidden="true">$</span><div><b>'+money(pg.monto)+'</b> · '+esc(pg.medio)+' · '+ddmm(pg.date)+(pg.fact?' · Facturado':'')+'</div><div class="acts"><button type="button" class="btn" data-act="editPago" data-id="'+t.id+'">Editar</button></div></div>';
  } else html+=pagoFields(pg,false)+'<button type="button" class="btn big primary" data-act="savePagoT" data-id="'+t.id+'">'+(pg?'Guardar cambios del pago':'Guardar pago')+'</button>'+(pg?'<button type="button" class="danger" data-act="delPagoT" data-id="'+t.id+'">Quitar pago</button>':'');
  html+='</div>';
  html+='<div class="sec"><details class="edit"><summary>Editar datos del turno</summary><div class="fields">'+pacField('eName',p?p.id:null)+'</div>'+
    '<div style="margin-top:12px">'+whenFields('e',t.date,t.time)+'</div>'+
    '<span class="lbl" style="display:block;margin:12px 0 8px">Duración</span>'+seg('eDur',[['30','30 min'],['60','60 min']],String(t.dur))+
    '<span class="lbl" style="display:block;margin:12px 0 8px">Tipo</span>'+seg('eTipo',TIPOS,t.tipo||'')+
    '<div style="margin-top:12px"><button type="button" class="btn big" data-act="saveEdit" data-id="'+t.id+'">Guardar cambios</button></div></details></div>';
  html+='<div class="df"><button type="button" class="danger" data-act="delTurno" data-id="'+t.id+'">Borrar turno</button><div class="r"><button type="button" class="btn big" data-act="close">Cerrar</button></div></div>';
  openModal(html);
}
function pagoFields(pg,withName){
  return '<div class="fields">'+
    (withName?pacField('pName',pg?(pg.pid||(paciente(pg.name)||{}).id):null):'')+
    '<label class="fld"><span>Fecha de pago</span><input id="pDate" type="date" value="'+(pg?pg.date:iso(today()))+'"></label>'+
    '<label class="fld"><span>Monto</span><input id="pMonto" inputmode="numeric" placeholder="$" value="'+(pg?Number(pg.monto).toLocaleString('es-AR'):'')+'"></label></div>'+
    '<span class="lbl">Medio de pago</span>'+seg('medio',MEDIOS.map(function(m){return [m,m]}),pg?pg.medio:null)+
    '<p class="err" id="pErr" hidden></p>';
}
function readPago(){
  var e=$('#pErr'), monto=parseInt(String($('#pMonto').value).replace(/\D/g,''),10), medio=segVal('medio'), date=$('#pDate').value;
  if(!monto){e.textContent='Escribí el monto.';e.hidden=false;return null}
  if(!medio){e.textContent='Elegí el medio de pago.';e.hidden=false;return null}
  if(!date){e.textContent='Elegí la fecha de pago.';e.hidden=false;return null}
  return {monto:monto,medio:medio,date:date};
}

/* Pago suelto (desde Pagos) */
function openPago(id){
  var pg=id?findP(id):null;
  var html=head(pg?'Pago':'Nuevo pago','Pagos de '+NUTRIS[ui.nutri]);
  html+='<div class="sec">'+pagoFields(pg,true)+'<label class="chkline"><input type="checkbox" id="pFact"'+(pg&&pg.fact?' checked':'')+'>Facturado</label></div>';
  html+='<div class="df">'+(pg?'<button type="button" class="danger" data-act="delPago" data-id="'+pg.id+'">Borrar pago</button>':'')+'<div class="r"><button type="button" class="btn big" data-act="close">Cancelar</button><button type="button" class="btn big primary" data-act="savePago" data-id="'+(pg?pg.id:'')+'">Guardar</button></div></div>';
  openModal(html);
}

/* Bloqueo */
function openBloq(id){
  var b=findB(id); if(!b)return;
  openModal(head('Bloqueado',esc(cap(largo(parse(b.date))))+' · '+show(toMin(b.from))+' – '+show(toMin(b.to)))+
    '<div class="sec">'+bloqFields(b)+'<p class="err" id="bErr" hidden></p></div>'+
    '<div class="df"><button type="button" class="danger" data-act="delBloq" data-id="'+b.id+'">Quitar bloqueo</button><div class="r"><button type="button" class="btn big" data-act="close">Cancelar</button><button type="button" class="btn big primary" data-act="saveBloq" data-id="'+b.id+'">Guardar</button></div></div>');
}

/* confirmación en dos toques (sin ventanas del navegador) */
function sure(btn){
  if(btn.classList.contains('sure'))return true;
  btn.dataset.txt=btn.textContent; btn.textContent='¿Seguro? Tocá de nuevo'; btn.classList.add('sure');
  setTimeout(function(){if(btn.isConnected){btn.classList.remove('sure');btn.textContent=btn.dataset.txt}},3000);
  return false;
}

/* ---------- eventos ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target;
  var segBtn=el.closest('[data-seg] button');
  if(segBtn){
    var g=segBtn.parentNode;
    $$('button',g).forEach(function(b){b.classList.toggle('on',b===segBtn);b.setAttribute('aria-pressed',b===segBtn)});
    var name=g.dataset.seg;
    if(name==='kind'){$('#kTurno').hidden=segBtn.dataset.val!=='turno';$('#kBloq').hidden=segBtn.dataset.val==='turno'}
    if(name==='estadoT'){var t=findT($('[data-act="delTurno"]').dataset.id);if(t){t.estado=segBtn.dataset.val;save();render()}}
    return;
  }
  var pick=el.closest('[data-pick]'); if(pick){pickPac(pick.dataset.for,pick.dataset.pick);return}
  if(!el.closest('.combo'))closeOpts();
  if(el===$('#overlay2')){$('#overlay2').hidden=true;return}
  if(el===$('#overlay')){closeModal();return}
  var tb=el.closest('[data-turno]'); if(tb){openTurno(tb.dataset.turno);return}
  var bb=el.closest('[data-blk]'); if(bb){openBloq(bb.dataset.blk);return}
  var pb=el.closest('[data-pago]'); if(pb){openPago(pb.dataset.pago);return}
  if(el.classList&&el.classList.contains('daycol')){
    var rect=el.getBoundingClientRect(), y=ev.clientY-rect.top, m=START+Math.floor(y/ROW)*30;
    if(m>=START&&m<END)openNuevo(el.dataset.date,hhmm(m));
    return;
  }
  var a=el.closest('[data-act]'); if(!a)return;
  var act=a.dataset.act, id=a.dataset.id, t2, pg, b2, r;
  switch(act){
    case 'view': ui.view=a.dataset.view; render(); break;
    case 'switch': ui.nutri=OTHER[ui.nutri]; render(); break;
    case 'hoy': ui.date=weekday(today()); render(); break;
    case 'prev': ui.date=isMobile()?prevWeekday(ui.date):addDays(ui.date,-7); render(); break;
    case 'next': ui.date=isMobile()?weekday(addDays(ui.date,1)):addDays(ui.date,7); render(); break;
    case 'day': ui.date=parse(a.dataset.date); render(); break;
    case 'mprev': ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()-1,1); render(); break;
    case 'mnext': ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+1,1); render(); break;
    case 'nuevo': openNuevo(iso(ui.date),null); break;
    case 'nuevoPago': openPago(null); break;
    case 'close': closeModal(); break;
    case 'saveNuevo': saveNuevo(); break;
    case 'savePhone': t2=findT(id); var ph=$('#tPhone').value.trim(), pp0=t2&&pacDe(t2); if(pp0&&ph){pp0.phone=ph;save();openTurno(id)} break;
    case 'newPac': openPacForm(a.dataset.for); break;
    case 'savePac': savePac(a.dataset.for); break;
    case 'close2': $('#overlay2').hidden=true; $('#dlg2').innerHTML=''; break;
    case 'editPago': openTurno(id,true); break;
    case 'savePagoT':
      t2=findT(id); r=readPago(); if(!t2||!r)break;
      pg=pagoDe(t2.id);
      if(pg){pg.monto=r.monto;pg.medio=r.medio;pg.date=r.date}
      else data.pagos.push({id:uid(),nutri:t2.nutri,turnoId:t2.id,name:t2.name,date:r.date,monto:r.monto,medio:r.medio,fact:false});
      save(); render(); openTurno(id); break;
    case 'delPagoT': if(!sure(a))break; pg=pagoDe(id); data.pagos=data.pagos.filter(function(x){return x!==pg}); save(); render(); openTurno(id); break;
    case 'saveEdit':
      t2=findT(id); if(!t2)break;
      var epid=pidOf('eName'), tm=timeVal('eTime','eOther'), dt=$('#eDate').value;
      if(!epid||!tm||!dt){var ee=$('#eName');ee.focus();ee.setCustomValidity&&ee.setCustomValidity('Elegí un paciente de la lista');ee.reportValidity&&ee.reportValidity();break}
      var pp=findPac(epid);
      t2.name=pp.name; t2.pid=pp.id; t2.date=dt; t2.time=tm; t2.dur=+segVal('eDur'); t2.tipo=segVal('eTipo')||'';
      pg=pagoDe(t2.id); if(pg)pg.name=t2.name;
      save(); goTo(dt); openTurno(id); break;
    case 'delTurno': if(!sure(a))break; data.turnos=data.turnos.filter(function(x){return x.id!==id}); data.pagos.forEach(function(x){if(x.turnoId===id)x.turnoId=null}); save(); closeModal(); render(); break;
    case 'savePago':
      var ppid=pidOf('pName');
      if(!ppid){$('#pErr').textContent='Elegí un paciente de la lista, o cargalo con el botón +.';$('#pErr').hidden=false;break}
      r=readPago(); if(!r)break;
      var p3=findPac(ppid);
      pg=id?findP(id):null;
      if(pg){pg.name=p3.name;pg.pid=p3.id;pg.monto=r.monto;pg.medio=r.medio;pg.date=r.date;pg.fact=$('#pFact').checked}
      else data.pagos.push({id:uid(),nutri:ui.nutri,turnoId:null,pid:p3.id,name:p3.name,date:r.date,monto:r.monto,medio:r.medio,fact:$('#pFact').checked});
      var pd=parse(r.date); ui.month=new Date(pd.getFullYear(),pd.getMonth(),1);
      save(); closeModal(); render(); break;
    case 'delPago': if(!sure(a))break; data.pagos=data.pagos.filter(function(x){return x.id!==id}); save(); closeModal(); render(); break;
    case 'saveBloq':
      b2=findB(id); if(!b2)break;
      var rb=readBloq(); if(!rb)break;
      b2.date=rb.date;b2.from=rb.from;b2.to=rb.to;b2.nota=rb.nota;
      save(); closeModal(); goTo(b2.date); break;
    case 'delBloq': if(!sure(a))break; data.bloqueos=data.bloqueos.filter(function(x){return x.id!==id}); save(); closeModal(); render(); break;
    case 'reset': if(!sure(a))break; data=seed(); render(); break;
  }
});
function prevWeekday(d){var x=addDays(d,-1);while(x.getDay()===0||x.getDay()===6)x=addDays(x,-1);return x}

document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.dataset&&el.dataset.fact){var p=findP(el.dataset.fact);if(p){p.fact=el.checked;save();render()}return}
  if(el.id==='nTime')$('#nOther').value='';
  if(el.id==='eTime')$('#eOther').value='';
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.classList&&el.classList.contains('pacin')){el.dataset.pid='';el.classList.remove('ok');if(el.setCustomValidity)el.setCustomValidity('');pacOptions(el)}
});
document.addEventListener('focusin',function(ev){var el=ev.target;if(el.classList&&el.classList.contains('pacin')&&!el.dataset.pid)pacOptions(el)});
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Escape')return;
  if($$('.opts').some(function(l){return !l.hidden})){closeOpts();return}
  if(!$('#overlay2').hidden){$('#overlay2').hidden=true;return}
  if(!$('#overlay').hidden)closeModal();
});
var mq=window.matchMedia('(max-width:760px)');
if(mq.addEventListener)mq.addEventListener('change',render);else if(mq.addListener)mq.addListener(render);
setInterval(function(){if(ui.view==='agenda'&&$('#overlay').hidden)render()},60000);

render();
})();
</script>
</body>
</html>
