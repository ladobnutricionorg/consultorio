<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#F4F5F1">
<title>Lado B · Consultorio</title>
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=4">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<meta name="apple-mobile-web-app-title" content="Lado B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17201B; --muted:#56605A; --soft:#6B746E; --line:#DDE1DA; --line2:#E6E9E4; --grid:#EEF0EC;
  --bg:#F4F5F1; --card:#fff; --lima:#D4FF3A;
  --conf:#FFE7A3; --canc:#F9D3CE; --cancInk:#7A2E25; --pendLine:#A3862A; --bloq:#DCE4E8; --bloqInk:#3E4E57;
  --ok:#2E7D3E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:'Archivo',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:1440px;margin:0 auto;padding:18px 28px 28px;display:flex;flex-direction:column;gap:12px}

/* Encabezado */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-areas:"nav logo who";align-items:center;gap:16px}
.nav{grid-area:nav;display:flex;gap:4px}
.nav button{border:0;background:transparent;font-size:13px;font-weight:600;color:#3D4741;height:34px;padding:0 12px;border-radius:8px;cursor:pointer}
.nav button:hover{background:#E6E9E2}
.nav button.on{background:var(--ink);color:#fff}
.logo{grid-area:logo;display:flex;justify-content:center;line-height:0}
.logo img{height:58px;width:auto;display:block}
.who{grid-area:who;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1.plain{text-transform:none;letter-spacing:0;font-size:16px}
#switchBtn{height:32px;font-size:12.5px;font-weight:600;padding:0 12px}
.btn{font-size:13px;font-weight:600;height:36px;padding:0 14px;border-radius:8px;border:1px solid #C9CFC8;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#9AA39C}
.btn.icon{width:36px;padding:0}
.btn.pill{border-radius:999px}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2A352F}
.row2{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.period{font-weight:800;font-size:17px;min-width:170px;text-align:center}

/* Agenda */
.board{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid{display:grid;min-width:900px}
.corner{border-bottom:1px solid var(--line)}
.dayhead{padding:10px 12px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.dn{font-weight:700;font-size:14px}
.num{font-weight:800;font-size:20px}
.cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.dayhead.today .num{background:var(--lima);border-radius:6px;padding:0 6px}
.times{display:flex;flex-direction:column}
.tm{height:30px;font-size:10.5px;color:var(--soft);text-align:right;padding:4px 8px 0 0;font-variant-numeric:tabular-nums}
.tm.full{color:var(--ink);font-weight:600}
.daycol{position:relative;border-left:1px solid var(--line2);cursor:pointer;background-image:repeating-linear-gradient(to bottom,transparent 0 29px,var(--grid) 29px 30px)}
.daycol.today{background-color:#FBFDF1}
.daycol:hover{background-color:#FAFBF8}
.daycol.today:hover{background-color:#F7FBE6}
.now{position:absolute;left:0;right:0;height:2px;background:#E2462F;z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:#E2462F}
.ev,.blk{position:absolute;left:3px;width:calc(100% - 6px);z-index:2;justify-content:flex-start;border:0;border-radius:4px;text-align:left;display:flex;align-items:center;gap:5px;padding:0 6px;font-size:11.5px;cursor:pointer;overflow:hidden}
.ev:hover,.blk:hover{box-shadow:inset 0 0 0 1.5px rgba(23,32,27,.55)}
.ev:focus-visible,.blk:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.ev .t{flex:none;width:28px;font-size:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .nm{text-align:left;flex:1 1 auto;min-width:0;font-weight:500;line-height:1.08;overflow-wrap:anywhere}
.ev .meta{flex:none;margin-left:auto;display:flex;gap:4px;align-items:center}
.tag{font-size:9.5px;font-weight:800;padding:1px 4px;border-radius:3px;background:rgba(23,32,27,.12)}
.ev.c{background:var(--conf)}
.ev.x{background:var(--canc)}
.ev.x .nm{text-decoration:line-through;color:var(--cancInk)}
.ev.p{background:#fff;border:1.5px dashed var(--pendLine)}
.ev.dup{padding:0 5px;gap:4px}
.ev.dup .nm{font-size:10.5px;line-height:1.05;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev.dup .tag{font-size:8.5px;padding:1px 3px}
.warnin{display:block;background:#FFF6DC;border:1px solid #EBCB6B;color:#5C4505;border-radius:8px;padding:10px 12px;font-weight:600}
.pay{flex:none;width:16px;height:16px;border-radius:50%;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.pay.ok{background:var(--ok);color:#fff}
.pay.no{border:1.5px solid #8A938D;color:#6B746E;background:rgba(255,255,255,.5)}
.blk{background-color:var(--bloq);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.55) 6px 9px);justify-content:center;color:var(--bloqInk)}
.blk.tall{flex-direction:column;gap:2px}
.blk .bl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.blk .blr{font-size:11px}
.blk .bln{text-transform:uppercase;font-size:12px;font-weight:600;background:#fff;padding:1px 6px;border-radius:3px;margin-top:3px;max-width:100%;text-align:center}
.tabs{display:none}
#bNota{text-transform:uppercase}
.wahint{display:block;font-size:11.5px;color:#7A837D;margin-top:4px;min-height:14px}.wahint b{color:#B5462E}
.bcol{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 2px}
.bcol .sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #D9DED6;background-color:var(--sw);background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.55) 4px 6px);cursor:pointer;padding:0}
.bcol .sw.on{box-shadow:0 0 0 2px #17201B}
.brep{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;margin:14px 0 4px;cursor:pointer}.brep input{width:18px;height:18px;accent-color:#17201B}
#bRepBox{display:flex;flex-direction:column;gap:10px;margin-top:6px}#bRepBox .seg{flex-wrap:wrap}.bhasta{max-width:220px}
.bdel{display:flex;gap:18px;flex-wrap:wrap}.bdel .danger{white-space:nowrap}
.df.ser{flex-wrap:wrap;row-gap:10px}.df.ser .r{order:1;width:100%;justify-content:flex-end;flex-wrap:wrap}.df.ser .bdel{order:2;width:100%;justify-content:flex-end;border-top:1px solid #EEF0EB;padding-top:10px}
.bhrow{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}.brep.sm{font-size:13px;font-weight:500;margin:0 0 10px}.fld.off{opacity:.4}
.sprog{display:flex;gap:12px;justify-content:center;font-size:12px;color:#9AA29C;margin:4px 0 0;min-height:16px}.sprog .ok{color:#3E7A1E;font-weight:600}
/* iPhone: evita el zoom automático al tocar un campo (pasa con letra menor a 16px) y que la página quede corrida */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (-webkit-touch-callout:none){@media(max-width:760px){input,select,textarea{font-size:16px!important}}}
body{overflow-x:hidden}
.fab{display:none}
/* Agenda: el encabezado queda fijo y solo scrollea la grilla (PC y celular) */
.app.fixmob{height:100vh;height:100dvh;overflow:hidden;padding-bottom:0}
.app.fixmob #main{flex:1;min-height:0;display:flex;flex-direction:column}
.app.fixmob .board{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-bottom-left-radius:0;border-bottom-right-radius:0}
.app.fixmob .foot{display:none}
.app.fixmob .corner,.app.fixmob .dayhead{position:sticky;top:0;z-index:6;background:var(--card)}

/* Pagos */
.col{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.col{max-width:760px}
.totals{display:flex;justify-content:center;gap:10px}
.tot{flex:0 1 287px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;flex-direction:column;gap:2px}
.tot span{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tot span em{font-style:normal;text-transform:none;letter-spacing:0;margin-left:4px}
.tot b{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
.tot small{font-size:12px;color:var(--muted)}
.tot.hi{background:var(--ink);border-color:var(--ink);color:#fff}
.tot.hi span,.tot.hi small{color:#C9D1CB}
.tot.fc{background:var(--lima);border-color:var(--lima)}
.tot.fc span,.tot.fc small{color:#2C3A0A}
.table{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.thead,.prow{display:grid;grid-template-columns:44px minmax(0,1fr) 100px 128px 82px 56px;align-items:center;column-gap:12px;padding:0 16px}
.prow{border-top:1px solid #F0F2EE}
.table .prow:nth-child(2){border-top:0}
.amt.debe{color:#A12F22;font-weight:800}
.prow.debe{background:#FFF8F6}
.prow .fp{font-size:11px;color:#9AA29C;font-variant-numeric:tabular-nums}.prow .fp,.thead .fp{text-align:center}
.thead .fp{font-size:inherit;color:inherit;white-space:nowrap}
.prow.debe:hover{background:#FFF1EE}
.wa.off{background:#F1F2EE;border-color:#E1E4DE;color:#A3AAA5;cursor:not-allowed;pointer-events:none}.wa.off svg{opacity:.45;filter:grayscale(1)}
.prow2{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:4px 0 12px}.prow2 .lbl{margin:0;min-width:104px}.prow2 .seg{flex:1}
.pdin{font:inherit;font-size:13.5px;font-weight:600;height:32px;border:0;border-bottom:1.5px solid #C9CFC8;background:transparent;padding:0 2px;color:var(--ink);outline:none}.pdin:focus{border-bottom-color:var(--ink)}
.pmontos{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:4px 0 14px}.pmontos .seg{flex:1}.pmontos{border-bottom:1px solid #ECEEE9;row-gap:0}.pmontos .seg{flex:none;border-bottom:0}
.pmo{font:inherit;font-size:13px;font-weight:500;width:84px;height:30px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0 2px;color:var(--ink);outline:none}
.pmo::placeholder{color:#B3BAB4}.pmo:focus{border-bottom-color:#C9CFC8}.pmo.on{font-weight:700;border-bottom-color:var(--ink)}
@media(max-width:700px){.prow2 .lbl{min-width:0}}
.seg.mseg{display:flex;gap:14px;flex-wrap:wrap}
.qwrap{display:flex;justify-content:flex-end;align-items:center;gap:7px}
.qd{width:22px;height:22px;flex:none;border-radius:50%;border:1.5px solid #9A3324;background:#fff;color:#9A3324;font:inherit;font-size:11.5px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.qd:hover{background:#FFF1EE}.qd.on{background:#17201B;border-color:#17201B;color:#D4FF3A}
.qpop{position:absolute;z-index:60;width:252px;background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(23,32,27,.18),0 0 0 1px rgba(23,32,27,.06);padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.qpop:before{content:'';position:absolute;top:-6px;left:var(--ax,190px);width:12px;height:12px;background:#fff;transform:rotate(45deg);box-shadow:-1px -1px 0 rgba(23,32,27,.06)}
.qpop.free .qopts.med{opacity:.3;pointer-events:none}
.qpop.up:before{top:auto;bottom:-6px;box-shadow:1px 1px 0 rgba(23,32,27,.06)}
.qnm{font-size:12px;font-weight:700;color:#3D4741;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qpop select,.qpop input{font:inherit;font-size:13px;font-weight:600;height:30px;width:100%;border:0;border-bottom:1.5px solid #C9CFC8;border-radius:0;background:transparent;padding:0 2px;color:#17201B;outline:none}
.qpop select:focus,.qpop input:focus{border-bottom-color:#17201B}
.qopts{display:flex;flex-wrap:wrap;gap:2px 10px;border-bottom:1px solid #ECEEE9;padding-bottom:2px}
.qopts button{font:inherit;font-size:12.5px;font-weight:500;color:#8A938D;border:0;background:none;padding:4px 1px;border-bottom:2px solid transparent;cursor:pointer}
.qopts button:hover{color:var(--ink)}
.qopts button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.qopts input{font:inherit;font-size:12.5px;width:62px;height:26px;border:0;border-bottom:2px solid transparent;background:none;padding:0 1px;color:var(--ink);outline:none}
.qopts input::placeholder{color:#B3BAB4}.qopts input:focus{border-bottom-color:#C9CFC8}.qopts input.on{font-weight:700;border-bottom-color:var(--ink)}
.qerr{margin:0;font-size:11.5px;font-weight:600;color:#9A3324}
.qft{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.qcn,.qgo{font:inherit;font-size:12.5px;height:28px;padding:0 2px;border:0;background:none;cursor:pointer}
.qcn{font-weight:600;color:#7A837D}
.qgo{font-weight:800;color:#17201B;border-bottom:2px solid #17201B;border-radius:0}
.pdate{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.thead{height:38px;background:#F6F7F3;border-bottom:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.r{text-align:right}.c{text-align:center}
.dayrow{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 6px;border-top:1px solid var(--line2)}
.table .dayrow:nth-child(2){border-top:0}
.dayrow b{font-size:14px;font-weight:800}
.dayrow span{font-size:12.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.prow{min-height:42px;font-size:13.5px}
.prow:hover{background:#FAFBF7}
.pname{border:0;background:transparent;text-align:left;padding:8px 0;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;font-size:13.5px}
.pname:hover span:first-child{text-decoration:underline}
.amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chip{justify-self:start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF0EA;color:#3D4741;white-space:nowrap}
.chip.mp{background:#E3EEFB;color:#1F4B7A}
.chip.ef{background:#E9F5DA;color:#2C4A12}
.chip.tj{background:#F1E6FA;color:#55267A}
.ck{justify-self:center;display:flex;align-items:center;justify-content:center;width:44px;height:42px;cursor:pointer}
.ck input{width:18px;height:18px;accent-color:var(--ink);cursor:pointer;margin:0}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.lbox img{width:180px;height:auto;align-self:center}
.lsub{margin:0 0 4px;text-align:center;color:var(--muted);font-size:13.5px}
.lforgot{border:0;background:none;color:var(--muted);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px}
.foot button{border:0;background:none;color:#2F5D3A;text-decoration:underline;cursor:pointer;font-size:12px;padding:4px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(23,32,27,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.overlay[hidden]{display:none}
.dlg{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dh{padding:20px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line2)}
.dh h2{margin:0;font-size:21px;font-weight:800;line-height:1.15}
.dh p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.xbtn{flex:none;width:40px;height:40px;border:0;background:#F1F2EE;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sec{padding:16px 22px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line2)}
.sec:last-of-type{border-bottom:0}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg button{font-size:13.5px;font-weight:600;height:42px;border:1px solid #C9CFC8;border-radius:8px;background:#fff;cursor:pointer;padding:0 6px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
[data-seg="llegada"] button[data-val="Google"]{color:#A3352A}
[data-seg="llegada"] button[data-val="Instagram"]{color:#A8296F}
[data-seg="llegada"] button[data-val="Referido"]{color:#1F5A9E}
[data-seg="llegada"] button[data-val="Otro"]{color:#8A6A0B}
[data-seg="llegada"] button.on[data-val="Google"]{background:#F6D3CE;border-color:#E09A90;color:#7E2219}
[data-seg="llegada"] button.on[data-val="Instagram"]{background:#FAD3E8;border-color:#E79BC4;color:#7D1A50}
[data-seg="llegada"] button.on[data-val="Referido"]{background:#D3E4F8;border-color:#93B7E2;color:#173F70}
[data-seg="llegada"] button.on[data-val="Otro"]{background:#FFE7A3;border-color:#E0B12A;color:#5C4505}
[data-seg="llegada"] button.on{font-weight:800}
.lleg{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;justify-self:start}
.lleg.Google{background:#F6D3CE;color:#7E2219}.lleg.Instagram{background:#FAD3E8;color:#7D1A50}.lleg.Referido{background:#D3E4F8;color:#173F70}.lleg.Otro{background:#FFE7A3;color:#5C4505}
.ficha{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;letter-spacing:.12em;height:28px;padding:0 11px;border-radius:6px;border:1px solid #D9DDD5;background:transparent;color:#56605A;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.ficha svg{opacity:.7}
.ficha:hover{border-color:var(--ink);color:var(--ink);background:#fff}
.warn{margin:0;background:#FFF6DC;border:1px solid #EBCB6B;color:#5C4505;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}
.warn b{font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.seg.estado button.on[data-val="c"]{background:var(--conf);border-color:#E0B12A;color:var(--ink)}
.seg.estado button.on[data-val="p"]{background:#FFF8E1;border:2px dashed var(--pendLine);color:var(--ink)}
.seg.estado button.on[data-val="x"]{background:var(--canc);border-color:#E3A097;color:var(--cancInk)}
.seg.estado button{color:#8A938D;font-weight:500}
.seg.estado button.on{font-weight:800}
.seg.estado button.on::before{content:"✓ "}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}

/* ---------- utilidades ---------- */

/* ---------- datos ---------- */

var data={turnos:[],bloqueos:[],pagos:[],pacientes:[]};
/* ---------- Firebase ---------- */
var FB_CONFIG={apiKey:"AIzaSyAK5JhG3yBIbuqMMr8SeZbhq7RZlXxWFmI",authDomain:"ladob-consultorio.firebaseapp.com",projectId:"ladob-consultorio",storageBucket:"ladob-consultorio.firebasestorage.app",messagingSenderId:"639263803246",appId:"1:639263803246:web:d297f0d993932888ff637f"};
firebase.initializeApp(FB_CONFIG);
var auth=firebase.auth(), db=firebase.firestore();
try{db.settings({cacheSizeBytes:firebase.firestore.CACHE_SIZE_UNLIMITED,merge:true})}catch(e){}
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
var SVTS=function(){return firebase.firestore.FieldValue.serverTimestamp()};
var COLS=['pacientes','turnos','bloqueos','pagos'], synced={}, loaded={}, unsubs=[], staff=null, pendingRender=false;
COLS.forEach(function(c){synced[c]={}});
function clean(o){return JSON.parse(JSON.stringify(o))}
/* Guarda en Firestore solo lo que cambió respecto de lo último sincronizado */
function save(){
  if(!staff)return;
  var batch=db.batch(), n=0;
  COLS.forEach(function(c){
    var seen={};
    data[c].forEach(function(o){seen[o.id]=1;var j=JSON.stringify(o);if(synced[c][o.id]!==j){synced[c][o.id]=j;var x=clean(o);delete x.id;x.updatedAt=SVTS();batch.set(db.collection(c).doc(o.id),x);n++}});
    /* borrado "suave": se marca como borrado para que los demás dispositivos se enteren sin releer todo */
    Object.keys(synced[c]).forEach(function(id){if(!seen[id]){delete synced[c][id];batch.set(db.collection(c).doc(id),{deleted:true,updatedAt:SVTS()},{merge:true});n++}});
  });
  if(n)batch.commit().catch(function(e){toast('No se pudo guardar. Revisá la conexión e intentá de nuevo.');console.error(e)});
}
function busy(){
  if(!$('#overlay').hidden||!$('#overlay2').hidden)return true;
  var a=document.activeElement;
  return a&&a.closest&&a.closest('#main')&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='checkbox';
}
var COL_TXT={pacientes:'pacientes',turnos:'agenda',bloqueos:'bloqueos',pagos:'pagos'};
function splashProg(){var t=$('#splashProg');if(!t)return;t.innerHTML=COLS.map(function(c){return '<span class="'+(loaded[c]?'ok':'')+'">'+(loaded[c]?'✓ ':'')+cap(COL_TXT[c])+'</span>'}).join('')}
function scheduleRender(){if(!staff||!['pacientes','turnos','bloqueos'].every(function(c){return loaded[c]}))return;
  if(!window.__rulesDone){window.__rulesDone=1;try{extendAllRules()}catch(e){console.error(e)}}
  if($('.app').hidden){$('.app').hidden=false;$('#splash').hidden=true;$('#login').hidden=true;pendingRender=false;render();return}if(busy()){pendingRender=true;return}pendingRender=false;render()}
/* Sincronización con lecturas mínimas:
   - la primera vez en cada dispositivo se lee todo y queda guardado en el navegador;
   - después se arranca desde esa copia (no cuenta como lectura) y solo se piden a Firebase
     los registros modificados desde la última vez (campo updatedAt). */
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function docObj(d){var o=d.data({serverTimestamps:'estimate'})||{},ts=o.updatedAt;delete o.updatedAt;o.id=d.id;return {o:o,ts:ts&&ts.toMillis?ts.toMillis():0,del:!!o.deleted,pend:d.metadata&&d.metadata.hasPendingWrites}}
/* Agendas 2023-2025 importadas (importado:'agenda2325'): al cargarlas se duplicaron una vez y las copias
   se borraron del servidor. Si un dispositivo llegó a bajar copias, acá se detectan y se descartan. */
var GHOST=null;
function ghostIds(){if(!GHOST)GHOST=lsGet('ladob_ghost2325')||{};return GHOST}
function fixAgenda2325(c){
  if(c!=='turnos'&&c!=='bloqueos')return;
  var flag='ladob_fix2325_'+c;if(lsGet(flag))return;
  var seen={},dup=false;data[c].forEach(function(o){if(o.importado!=='agenda2325')return;
    var k=[o.nutri,o.date,o.time||o.from,o.name||o.nota,o.to||''].join('|');if(seen[k])dup=true;seen[k]=1});
  if(!dup){lsSet(flag,1);return}
  db.collection(c).where('importado','==','agenda2325').get({source:'server'}).then(function(sn){
    var ok={};sn.docs.forEach(function(d){ok[d.id]=1});var g=ghostIds();
    data[c].forEach(function(o){if(o.importado==='agenda2325'&&!ok[o.id])g[o.id]=1});
    lsSet('ladob_ghost2325',g);lsSet(flag,1);
    data[c]=data[c].filter(function(o){return !g[o.id]});delete synced[c];synced[c]={};data[c].forEach(function(o){synced[c][o.id]=JSON.stringify(o)});
    scheduleRender();
  }).catch(function(e){console.error(e)});
}
function applyDocs(c,list,replace){
  var map={};if(!replace)data[c].forEach(function(o){map[o.id]=o});
  var g=ghostIds();
  list.forEach(function(x){if(x.del||g[x.o.id])delete map[x.o.id];else map[x.o.id]=x.o});
  data[c]=Object.keys(map).map(function(k){return map[k]});
  synced[c]={};data[c].forEach(function(o){synced[c][o.id]=JSON.stringify(o)});
}
/* Pagos: la primera vez en un dispositivo se bajan solo los del año pasado en adelante;
   los años anteriores se bajan cuando alguien los abre en la pestaña Pagos (y quedan guardados). */
var PAGOS_DESDE=(today().getFullYear()-1)+'-01-01', pagosYrs=null, pagosYrLoading={};
function pagosYearOk(y){
  if(!pagosYrs)pagosYrs=lsGet('ladob_pagos_yrs')||(lsGet('ladob_sync_pagos')?{all:1}:{});
  return pagosYrs.all||String(y)>=PAGOS_DESDE.slice(0,4)||pagosYrs[y];
}
function loadPagosYear(y){
  if(pagosYearOk(y)||pagosYrLoading[y])return;
  pagosYrLoading[y]=1;
  db.collection('pagos').where('date','>=',y+'-01-01').where('date','<=',y+'-12-31').get({source:'server'}).then(function(sn){
    applyDocs('pagos',sn.docs.map(docObj).filter(function(x){return !x.del}),false);
    pagosYrs[y]=1;lsSet('ladob_pagos_yrs',pagosYrs);delete pagosYrLoading[y];render();
  }).catch(function(e){console.error(e);delete pagosYrLoading[y];toast('No se pudieron bajar los pagos de '+y+'. Revisá la conexión.')});
}
function startCol(c){
  var key='ladob_sync_'+c, last=lsGet(key)||0;
  var full=function(){last=0;
    if(c==='pagos'){pagosYrs={};lsSet('ladob_pagos_yrs',pagosYrs);return db.collection(c).where('date','>=',PAGOS_DESDE).get({source:'server'})}
    return db.collection(c).get({source:'server'})};
  (last?db.collection(c).get({source:'cache'}).then(function(sn){return sn.empty?full():sn}).catch(full):full())
  .then(function(sn){
    var mx=last, list=sn.docs.map(docObj);
    list.forEach(function(x){if(!x.pend&&x.ts>mx)mx=x.ts});
    applyDocs(c,list,true);fixAgenda2325(c);
    if(!mx)mx=1; lsSet(key,mx);
    loaded[c]=true; splashProg(); scheduleRender();
    var q=db.collection(c).where('updatedAt','>',firebase.firestore.Timestamp.fromMillis(mx));
    unsubs.push(q.onSnapshot({includeMetadataChanges:false},function(s2){
      var ch=s2.docChanges().filter(function(x){return x.type!=='removed'}).map(function(x){return docObj(x.doc)}), m2=lsGet(key)||mx;
      ch.forEach(function(x){if(!x.pend&&x.ts>m2)m2=x.ts});
      lsSet(key,m2);
      if(ch.length){applyDocs(c,ch,false);scheduleRender()}
    },function(e){console.error(e)}));
  }).catch(function(e){console.error(e);showLogin('No se pudieron leer los datos. Puede que tu usuario no tenga permiso.')});
}
function ensureRanges(){}
function listen(){
  unsubs.forEach(function(u){u()});unsubs=[];
  COLS.forEach(startCol);
}
function showLogin(msg){
  $('#login').hidden=false;$('.app').hidden=true;$('#splash').hidden=true;

  var b=$('#lBtn');b.disabled=false;b.textContent='Entrar';

auth.onAuthStateChanged(function(u){
  if(!u){staff=null;unsubs.forEach(function(x){x()});unsubs=[];showLogin();return}
  var email=(u.email||'').toLowerCase();
  db.collection('staff').doc(email).get().then(function(d){
    if(!d.exists){auth.signOut();showLogin('Tu usuario ('+email+') todavía no tiene acceso. Pedile a Fede que lo habilite.');return}
    staff=d.data();staff.email=email;
    if(staff.nutri==='fran'||staff.nutri==='car')ui.nutri=staff.nutri;
    $('#who').textContent=(staff.nombre||email);

    $('#splashTxt').textContent=lsGet('ladob_sync_pacientes')?'Cargando…':'Primera vez en este dispositivo: estamos descargando la base. Puede tardar unos segundos.';
    COLS.forEach(function(c){loaded[c]=false});splashProg();
    listen();
  }).catch(function(e){console.error(e);auth.signOut();showLogin('Tu usuario no tiene acceso a la base. Pedile a Fede que lo habilite.')});
});

/* ---------- consultas ---------- */
function turnosDe(n,di){return data.turnos.filter(function(t){return t.nutri===n&&t.date===di}).sort(function(a,b){return toMin(a.time)-toMin(b.time)})}
function bloqueosDe(n,di){return data.bloqueos.filter(function(b){return b.nutri===n&&b.date===di})}

/* Selector de paciente: solo se puede elegir de la lista; "+" para cargar uno nuevo */
function pacField(id,pid){

    '<input id="'+id+'" class="pacin'+(p?' ok':'')+'" autocomplete="off" placeholder="Buscar paciente…" value="'+esc(p?p.name:'')+'" data-pid="'+(p?p.id:'')+'" role="combobox" aria-expanded="false" aria-controls="'+id+'L">'+

}
function pacOptions(input){
  var q=norm(input.value), list=$('#'+input.id+'L');
  /* la lista aparece recién cuando se empieza a escribir */
  if(!q){if(list)list.hidden=true;input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');return}
  var all=data.pacientes.filter(function(p){return !q||norm(p.name).indexOf(q)>-1});
  all.sort(function(a,b){var x=(a.nutri===ui.nutri?0:1)-(b.nutri===ui.nutri?0:1);return x||a.name.localeCompare(b.name)});
  all=all.slice(0,8);
  list.innerHTML=all.length?all.map(function(p,i){return '<button type="button" role="option" id="'+input.id+'O'+i+'"'+(q&&i===0?' class="act" aria-selected="true"':'')+' data-pick="'+p.id+'" data-for="'+input.id+'"><span>'+esc(p.name)+'</span>'+(p.nutri!==ui.nutri?'<small>de '+NUTRIS[p.nutri]+'</small>':'')+'</button>'}).join('')
    :'<div class="none">No está en la lista. Tocá <b>+</b> para cargarlo.</div>';
  list.hidden=false; input.setAttribute('aria-expanded','true');
  if(q&&all.length)input.setAttribute('aria-activedescendant',input.id+'O0');else input.removeAttribute('aria-activedescendant');
}
/* flechas arriba/abajo para moverse entre las opciones y Enter para elegir */
function pacKey(ev){
  var input=ev.target, list=$('#'+input.id+'L'); if(!list||list.hidden)return;
  var opts=$$('[data-pick]',list); if(!opts.length)return;
  var i=opts.findIndex(function(o){return o.classList.contains('act')});
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){
    ev.preventDefault();

/* Número para WhatsApp: acepta cualquier forma de escribir un celular argentino
   (11 / 0384 / 3854 / con o sin 15 / con +54 / con 9 / sin característica = CABA) y lo deja como 549 + característica + número */
function waNum(raw){
  if(!raw)return null;
  var intl=/^\s*(\+|00)/.test(raw), d=String(raw).replace(/\D/g,'');
  if(d.indexOf('00')===0)d=d.slice(2);
  if(d.indexOf('54')===0&&d.length>=12){d=d.slice(2);if(d.charAt(0)==='9')d=d.slice(1)}
  else if(intl&&d.indexOf('54')!==0)return d.length>=8?d:null; /* número de otro país */
  if(d.charAt(0)==='0')d=d.slice(1);
  if(d.length===12){ /* tiene el 15 después de la característica */
    if(d.indexOf('11')===0&&d.substr(2,2)==='15')d='11'+d.slice(4);
    else if(d.substr(3,2)==='15')d=d.slice(0,3)+d.slice(5);
    else if(d.substr(4,2)==='15')d=d.slice(0,4)+d.slice(6);
  }
  if(d.length===10&&d.indexOf('15')===0)d='11'+d.slice(2); /* 15 + 8 cifras sin característica: CABA */
  if(d.length===8)d='11'+d; /* 8 cifras sin característica: CABA */
  return d.length===10?'549'+d:null;
}
function waShow(n){if(!n)return '';if(n.indexOf('549')!==0||n.length!==13)return '+'+n;var d=n.slice(3);return d.indexOf('11')===0?'+54 9 11 '+d.slice(2,6)+'-'+d.slice(6):'+54 9 '+d}

  $('#switchBtn').setAttribute('aria-label','Ver '+V[1]+' de '+O);
  document.title=(pac?V[0]:V[0]+' de '+N)+' · Lado B';

function weekLabel(ws){
  var we=addDays(ws,4);
  if(ws.getMonth()===we.getMonth())return ws.getDate()+' – '+we.getDate()+' '+MESES[ws.getMonth()].slice(0,3)+' '+we.getFullYear();
  return ws.getDate()+' '+MESES[ws.getMonth()].slice(0,3)+' – '+we.getDate()+' '+MESES[we.getMonth()].slice(0,3)+' '+we.getFullYear();
}

  html+='<div class="corner"></div>';
  days.forEach(function(d){
    var di=iso(d), n=turnosDe(ui.nutri,di).filter(function(t){return t.estado!=='x'}).length;
    html+='<div class="dayhead'+(di===td?' today':'')+'"><span class="dn">'+(mob?DIAS[d.getDay()]:DIAS[d.getDay()])+'</span><span class="num">'+d.getDate()+'</span><span class="cnt">'+n+' turno'+(n===1?'':'s')+'</span></div>';
  });

  for(var m=START;m<END;m+=30)html+='<div class="tm'+(m%60===0?' full':'')+'">'+show(m)+'</div>';
  html+='</div>';
  days.forEach(function(d){html+=dayCol(d)});
  html+='</div></div>';

  var ob=$('.board'), st=ob?ob.scrollTop:null;
  $('#main').innerHTML=html;

function dayCol(d){
  var di=iso(d), H=(END-START)/30*ROW, isT=di===iso(today()), inner='', now=new Date();
  if(isT){var nm=now.getHours()*60+now.getMinutes(); if(nm>=START&&nm<=END)inner+='<div class="now" style="top:'+((nm-START)/30*ROW)+'px" aria-hidden="true"></div>';}
  bloqueosDe(ui.nutri,di).forEach(function(b){
    var a=toMin(b.from), z=toMin(b.to), top=(a-START)/30*ROW+2, h=(z-a)/30*ROW-4, tall=h>40;
    inner+='<button type="button" class="blk'+(tall?' tall':'')+'" data-blk="'+b.id+'" style="top:'+top+'px;height:'+h+'px'+(b.color&&BCOL[b.color]?';--bloq:'+BCOL[b.color][1]+';--bloqInk:'+BCOL[b.color][2]:'')+'"><span class="bl">Bloqueado</span>'+(tall?'<span class="blr">'+show(a)+' – '+show(z)+'</span>':'')+(b.nota?'<span class="bln">'+esc(b.nota)+'</span>':'')+'</button>';
  });
  /* turnos en el mismo horario se reparten el ancho, uno al lado del otro */
  var TS=turnosDe(ui.nutri,di), lay={}, grp=[], gEnd=-1;
  var flush=function(){if(!grp.length)return;var cols=[];grp.forEach(function(t){var a=toMin(t.time),c=0;while(cols[c]!=null&&cols[c]>a)c++;cols[c]=a+t.dur;lay[t.id]={c:c}});grp.forEach(function(t){lay[t.id].n=cols.length});grp=[]};
  TS.forEach(function(t){var a=toMin(t.time);if(a>=gEnd){flush();gEnd=-1}grp.push(t);gEnd=Math.max(gEnd,a+t.dur)});flush();
  TS.forEach(function(t){
    var m=toMin(t.time), top=(m-START)/30*ROW+2, h=t.dur/30*ROW-4, pg=pagoDe(t.id), pay='', L=lay[t.id]||{c:0,n:1};
    var pos=L.n>1?'left:calc(3px + (100% - 6px) * '+L.c+' / '+L.n+');width:calc((100% - 6px) / '+L.n+' - 2px);':'';
    var when=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,m);
    if(t.estado==='c'){ if(pg)pay='<span class="pay ok" title="Pagado" aria-label="Pagado">$</span>'; else if(when<=now)pay='<span class="pay no" title="Sin pagar" aria-label="Sin pagar">$</span>'; }
    inner+='<button type="button" class="ev '+t.estado+(L.n>1?' dup':'')+'" data-turno="'+t.id+'" title="'+esc(t.name)+'" style="top:'+top+'px;height:'+h+'px;'+pos+'">'+(L.n>1?'':'<span class="t">'+show(m)+'</span>')+'<span class="nm">'+esc(t.name)+'</span><span class="meta">'+(t.tipo?'<span class="tag">'+esc(t.tipo)+'</span>':'')+pay+'</span></button>';
  });
  return '<div class="daycol'+(isT?' today':'')+'" data-date="'+di+'" style="height:'+H+'px" title="Tocá un horario libre para dar un turno">'+inner+'</div>';
}

/* ---------- Firmar facturas: se toma la 1.ª hoja del PDF de ARCA, se le pone la firma de la profesional
   (según el CUIT de la factura) siempre en el mismo lugar y se devuelve un PNG "FC <pto vta>-<número>.png".
   Las firmas están en stats/firma_<nutri> (tipo:'firma', cuit, png) y no en el repo, que es público. ---------- */
var FIRMA_BOX={x:.675,y:.5176,w:.15,h:.0647};
function pdfjsLoad(){return new Promise(function(res,rej){if(window.pdfjsLib)return res();var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  sc.onload=function(){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';res()};sc.onerror=function(){rej(new Error('No se pudo cargar el lector de PDF'))};document.head.appendChild(sc)})}
function imgLoad(src){return new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=src})}
async function firmarUno(file,f){
  /* tipografía: las facturas de ARCA usan Arial/Helvetica sin incrustar; se dibujan con la Arial del equipo (como el visor de PDF)
     y, si el equipo no la tiene (Android), con Liberation Sans, que tiene exactamente las mismas medidas */
  var pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer(),standardFontDataUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/',
    cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true,fontExtraProperties:true}).promise,pg=await pdf.getPage(1);
  /* el texto del PDF viene desordenado: se ordena por renglón (y) y dentro del renglón por x */
  var its=(await pg.getTextContent()).items.filter(function(i){return i.str&&i.str.trim()}).map(function(i){return {s:i.str,x:i.transform[4],y:Math.round(i.transform[5]/2)}});
  its.sort(function(a,b){return b.y-a.y||a.x-b.x});
  var txt=its.map(function(i){return i.s}).join(' ').replace(/\s+/g,' ');
  var pv=txt.match(/Punto de Venta:?\s*(\d+)/i),nro=txt.match(/Comp\.?\s*Nro:?\s*(\d+)/i),cuit=txt.match(/CUIT:?\s*(\d{11})/i);
  if(!pv||!nro)throw new Error('no parece una factura de ARCA (no se encontró el número)');
  /* control: la factura tiene que ser del CUIT de quien firma */
  if(f.cuit&&cuit&&cuit[1]!==f.cuit)throw new Error('es del CUIT '+cuit[1]+' y la firma de '+NUTRIS[f.nutri]+' corresponde al '+f.cuit+'. No se firmó.');
  var cli=txt.match(/Raz[oó]n Social:\s*(.+?)\s+(?:Condici[oó]n|Domicilio)/gi),cliente=cli&&cli.length>1?cli[1].replace(/^.*Social:\s*/i,'').replace(/\s+(Condici[oó]n|Domicilio).*$/i,'').trim():'';
  var vp=pg.getViewport({scale:4}),c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);
  await pg.render({canvasContext:g,viewport:vp}).promise;
  /* cada firma tiene su lugar (f.box, en proporción de la hoja); si no, el de la firma de Car */
  var B=f.box||FIRMA_BOX,im=await imgLoad(f.png),bw=B.w*c.width,bh=B.h*c.height,k=Math.min(bw/im.width,bh/im.height),w=im.width*k,h=im.height*k;
  g.drawImage(im,B.x*c.width+(bw-w)/2,B.y*c.height+(bh-h)/2,w,h);
  var blob=await new Promise(function(r){c.toBlob(r,'image/png')});
  return {name:'FC '+pv[1]+'-'+nro[1]+'.png',blob:blob,url:URL.createObjectURL(blob),cliente:cliente,tel:fcTel(cliente)};
}
/* teléfono del paciente de la factura (se busca por nombre y apellido) */
function fcTel(cli){
  var t=norm(cli).split(/\s+/).filter(function(w){return w.length>1});if(t.length<2)return '';
  var c=data.pacientes.filter(function(p){if(p.deleted||p.mergedInto||!p.phone)return false;var q=norm(p.name).split(/\s+/);return t.filter(function(w){return q.indexOf(w)>=0}).length>=2});
  return c.length===1?(waNum(c[0].phone)||''):'';
}
async function firmarFacturas(files){
  var n=ui.fcFirma,btn=$('[data-act="firmar"]'),lbl=btn?btn.innerHTML:'',out=[],errs=[];
  if(btn){btn.disabled=true;btn.textContent='Firmando…'}
  try{
    await pdfjsLoad();
    var d=await db.collection('stats').doc('firma_'+n).get(),f=d.exists?d.data():null;
    if(!f||!f.png)throw new Error('Todavía no está cargada la firma de '+NUTRIS[n]+'. Pedile a Fede que la cargue.');
    f.nutri=n;
    for(var i=0;i<files.length;i++){try{out.push(await firmarUno(files[i],f))}catch(e){errs.push(files[i].name+': '+e.message)}}
  }catch(e){errs.push(e.message)}
  if(btn){btn.disabled=false;btn.innerHTML=lbl}
  window.__fcOut=out;
  $('#dlg2').innerHTML=head(out.length===1?'Factura firmada':out.length?out.length+' facturas firmadas':'No se pudo firmar','','close2')+
    '<div class="sec">'+(errs.length?'<p class="warn">'+errs.map(esc).join('<br>')+'</p>':'')+'<div class="fcl">'+out.map(function(o,i){return '<figure class="fcf"><div class="fcact"><button type="button" class="btn" data-act="fcBajar" data-id="'+i+'">'+ICON.down+'Descargar</button><button type="button" class="btn fcwa" data-act="fcWa" data-id="'+i+'">'+ICON.wa+'Enviar por WhatsApp</button></div><div class="fcwab" id="fcWa_'+i+'" hidden></div>'+
      '<figcaption><b>'+esc(o.name)+'</b>'+(o.cliente?'<span>'+esc(o.cliente)+'</span>':'')+'</figcaption><img src="'+o.url+'" alt="'+esc(o.name)+'"></figure>'}).join('')+'</div></div>'+
    (out.length>1?'<div class="df"><div class="r"><button type="button" class="btn big primary" data-act="fcBajar">Descargar todas</button></div></div>':'');
  $('#overlay2').hidden=false;
}

async function firmaPng(file){ /* recorta lo transparente y la deja de 420 px de ancho */
  var url=URL.createObjectURL(file),im=await imgLoad(url);URL.revokeObjectURL(url);
  var c=document.createElement('canvas');c.width=im.width;c.height=im.height;var g=c.getContext('2d');g.drawImage(im,0,0);
  var d=g.getImageData(0,0,c.width,c.height).data,x0=c.width,y0=c.height,x1=-1,y1=-1;
  for(var y=0;y<c.height;y++)for(var x=0;x<c.width;x++)if(d[(y*c.width+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)throw new Error('la imagen está vacía');
  var W=Math.min(420,x1-x0+1),H=Math.round((y1-y0+1)*W/(x1-x0+1)),o=document.createElement('canvas');o.width=W;o.height=H;
  o.getContext('2d').drawImage(c,x0,y0,x1-x0+1,y1-y0+1,0,0,W,H);return o.toDataURL('image/png');
}

function renderPagos(){
  var y=ui.month.getFullYear(), mo=ui.month.getMonth();
  var ty=today().getFullYear(), yrs=[];for(var yy=2023;yy<=Math.max(ty+1,y);yy++)yrs.push(yy);
  var isCur=y===ty&&mo===today().getMonth();
  $('#row2').innerHTML='<select class="msel" id="pMes" aria-label="Mes">'+MESES.map(function(m,i){return '<option value="'+i+'"'+(i===mo?' selected':'')+'>'+cap(m)+'</option>'}).join('')+'</select>'+
    '<select class="msel" id="pAnio" aria-label="Año">'+yrs.map(function(v){return '<option value="'+v+'"'+(v===y?' selected':'')+'>'+v+'</option>'}).join('')+'</select>'+
    '<button type="button" class="btn" data-act="mhoy"'+(isCur?' disabled':'')+'>Mes actual</button>'+
    '<span class="r2x"><button type="button" class="btn" data-act="firmar">'+ICON.edit+'Firmar factura</button><input type="file" id="fcFile" accept="application/pdf,.pdf" multiple hidden>'+
    (staff&&staff.rol==='admin'?'<button type="button" class="btn ghost" data-act="firmas">Firmas</button>':'')+'</span>';
  var pref=y+'-'+pad(mo+1)+'-';

  var tot=0,tf=0,cf=0; list.forEach(function(p){tot+=+p.monto;if(p.fact){tf+=+p.monto;cf++}});
  var html='<div class="col"><div class="totals">'+
    '<div class="tot hi"><span>Total del mes<em>('+list.length+')</em></span><b>'+money(tot)+'</b></div>'+
    '<div class="tot fc"><span>Facturado</span><b>'+money(tf)+'</b></div></div>';
  html+='<div class="table"><div class="thead"><span>Fecha</span><span>Paciente</span><span class="r">Monto</span><span>Medio</span><span class="fp">Fecha pago</span><span class="c">Fact.</span></div>';
  /* Deudas: turnos confirmados que ya pasaron y no tienen pago (desde el 1/11/2026) */
  var now=new Date(), deudas=data.turnos.filter(function(t){
    if(cargando||t.nutri!==ui.nutri||t.estado!=='c'||t.date<'2026-11-01'||t.date.indexOf(pref)!==0||pagoDe(t.id))return false;
    var d=parse(t.date);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,toMin(t.time))<=now;
  });
  /* la fecha de la izquierda es la de atención (el turno); el mes se arma por fecha de pago */
  var atte=function(p){var t=p.turnoId?findT(p.turnoId):null;return t?t.date:p.date};
  var rows=list.map(function(p){return {k:atte(p),p:p}}).concat(deudas.map(function(t){return {k:t.date+' '+t.time,t:t}}));
  rows.sort(function(a,b){return a.k<b.k?-1:a.k>b.k?1:0});
  if(cargando)html+='<div class="empty">Cargando los pagos'+(loaded.pagos?' de '+y:'')+'…</div>';
  else if(!rows.length)html+='<div class="empty">No hay pagos cargados en '+MESES[mo]+'. Se cargan desde la agenda, tocando el turno del paciente.</div>';
  rows.forEach(function(r){

var DIAS_L=['domingos','lunes','martes','miércoles','jueves','viernes','sábados'],DIAS_1=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],ORD=['primer','segundo','tercer','cuarto','último'];
function nthOf(d){var n=Math.ceil(d.getDate()/7);return n>=5?5:n}

  var v=$('#bDate')&&$('#bDate').value, bs=$$('[data-seg="brep"] button');if(!v||bs.length<2)return;
  var d=parse(v),n=nthOf(d);

/* Bloqueos "sin fecha de finalización": se guarda la regla y se crean los bloqueos de los próximos 6 meses.
   Cada vez que alguien abre la app, se completan solos hasta 6 meses adelante (nunca se arma un archivo eterno).
   Los ids son fijos (serie_fecha) para que dos dispositivos no dupliquen. */
var SERIE_MESES=6;
function extendRule(r){
  var t=today(),hor=iso(new Date(t.getFullYear(),t.getMonth()+SERIE_MESES,t.getDate()));
  if(r.hasta&&r.hasta<hor)hor=r.hasta;
  var ds=bRepDates(r.start,r.rep,hor,true),n=0,skip=r.skip||[];
  ds.forEach(function(dd){
    if((r.gen&&dd<=r.gen)||skip.indexOf(dd)>=0)return;
    var id=r.serie+'_'+dd;if(findB(id))return;
    data.bloqueos.push({id:id,nutri:r.nutri,date:dd,from:r.from,to:r.to,nota:r.nota,color:r.color,serie:r.serie,rep:r.rep});n++;
  });
  if(ds.length&&(!r.gen||ds[ds.length-1]>r.gen))r.gen=ds[ds.length-1];
  return n;
}
function extendAllRules(){var ch=0;data.bloqueos.forEach(function(r){if(r.regla&&!r.fin)ch+=extendRule(r)});if(ch)save();}
function reglaDe(serie){return data.bloqueos.find(function(x){return x.regla&&x.serie===serie})}
function bRepDates(start,mode,until){
  var d0=parse(start),out=[],lim=parse(until),max=new Date(d0.getFullYear()+2,d0.getMonth(),d0.getDate());if(lim>max&&!arguments[3])lim=max;
  if(mode==='sem'){for(var d=new Date(d0);d<=lim;d.setDate(d.getDate()+7))out.push(iso(d));return out}
  var n=nthOf(d0),wd=d0.getDay();
  for(var m=0;;m++){var y=d0.getFullYear(),mo=d0.getMonth()+m,x;
    if(n===5){x=new Date(y,mo+1,0);while(x.getDay()!==wd)x.setDate(x.getDate()-1)}
    else{x=new Date(y,mo,1);while(x.getDay()!==wd)x.setDate(x.getDate()+1);x.setDate(x.getDate()+7*(n-1));if(x.getMonth()!==((mo%12)+12)%12)continue}
    if(x>lim)break;out.push(iso(x))}
  return out;
}

  }
  data.turnos.push({id:uid(),nutri:ui.nutri,date:date,time:time,dur:dur,name:p.name,pid:p.id,tipo:segVal('tipo')||'',estado:segVal('estado')});
  save();closeModal();goTo(date);

  var paso=function(t){if(btn)btn.textContent=t};
  ibRead(file,paso).then(function(v){
    if(!hf)return v;
    return ibReadHistory(hf,paso,IBH).then(function(h){hist=h;return v},function(){return v});
  }).then(function(v){
    if(!hf1||!hist.length)return v;
    return ibReadHistory(hf1,paso,IBH1).then(function(h){var by={};h.forEach(function(x){by[x.d]=x});hist.forEach(function(x){x.visc=by[x.d]?by[x.d].visc:null});return v},function(){return v});
  }).then(function(v){
    if(!v.fecha&&fm)v.fecha=fm[1]+'-'+fm[2]+'-'+fm[3];
    var falt=IB_FORM.slice(1).filter(function(f){return v[f[0]]==null}).length;
    openIbForm(pid,v,!v._formato?'La imagen no parece la hoja principal del InBody. Completá los datos a mano.':falt?'Hay '+falt+' dato'+(falt===1?'':'s')+' que no se pudo leer (marcado'+(falt===1?'':'s')+' en amarillo). Completalo'+(falt===1?'':'s')+' o dejalo'+(falt===1?'':'s')+' vacío'+(falt===1?'':'s')+'.':null,hist);
  }).catch(function(err){openIbForm(pid,{},'No se pudo leer la imagen ('+err.message+'). Podés cargar los datos a mano.')})
  .then(function(){if(btn){btn.disabled=false;btn.innerHTML=lbl}});
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='bRep'){$('#bRepBox').hidden=!t.checked;if(t.checked){bRepLabels();var u=$('#bUntil');if(!u.value){var d=parse($('#bDate').value);u.value=iso(new Date(d.getFullYear(),d.getMonth()+3,d.getDate()))}}}
  if(t.id==='bDate')bRepLabels();
  if(t.id==='bNoEnd'){var u2=$('#bUntil');u2.disabled=t.checked;u2.closest('.fld').classList.toggle('off',t.checked)}
});
document.addEventListener('input',function(ev){if(ev.target.id==='qTel'){var h=$('#qTelHint');if(h)h.innerHTML=telHint(ev.target.value)}});
document.addEventListener('toggle',function(ev){var t=ev.target;if(!t.dataset)return;if(t.dataset.sec)ui.sec[t.dataset.sec]=t.open;
  if(t.classList.contains('medlist')){if(t.closest('[data-sec="med"]'))ui.medList=t.open;else ui.labList=t.open}},true);
document.addEventListener('change',function(ev){if(ev.target.id==='fcFile'&&ev.target.files.length){firmarFacturas([].slice.call(ev.target.files));return}
  if(ev.target.classList&&ev.target.classList.contains('fsfile')&&ev.target.files.length){var n=ev.target.dataset.n,cu=$('#fsCuit_'+n).value.replace(/\D/g,'');
    firmaPng(ev.target.files[0]).then(function(png){var o={tipo:'firma',nutri:n,png:png,updatedAt:SVTS()};if(cu)o.cuit=cu;return db.collection('stats').doc('firma_'+n).set(o,{merge:true})})
    .then(function(){toast('Firma guardada');openFirmas()}).catch(function(e){toast('No se pudo cargar la firma: '+e.message)})}});
document.addEventListener('change',function(ev){var t=ev.target;if(!t.classList)return;
  if(t.classList.contains('gin'))gSave(t);
  else if(t.classList.contains('gcname')||t.classList.contains('gcgr')){var C=gConf().map(function(c){return Object.assign({},c)}),c=C.filter(function(x){return x.id===t.dataset.cid})[0];if(!c)return;
    if(t.classList.contains('gcname')){var nv=t.value.trim();if(!nv){t.value=c.n;return}c.n=nv}else c.g=t.value;gConfSave(C,'Guardado en todos los meses')}});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('gaamt')){ev.preventDefault();gAgregar(ev.target.dataset.g);return}
  if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('gin')){ev.preventDefault();var all=$$('.gin'),i=all.indexOf(ev.target);ev.target.blur();if(all[i+1])all[i+1].focus()}
  if(ev.key==='Enter'&&ev.target.id==='gcNewN'){ev.preventDefault();var b=$('[data-act="gcAdd"]');if(b)b.click()}});
document.addEventListener('change',function(ev){var t=ev.target;if(t.id!=='fr_add')return;var k=t.value;if(!k)return;
  if(k==='__otra'){ui.rOtra=true;restrSet(function(){});return}
  restrSet(function(r){r[k]=true});});
document.addEventListener('keydown',function(ev){if(ev.target.id!=='fr_txt')return;
  if(ev.key==='Enter'){ev.preventDefault();restrOk()}else if(ev.key==='Escape'){ui.rOtra=false;restrSet(function(){})}});
document.addEventListener('mousemove',function(ev){
  if(ui.view!=='agenda'||isMobile())return;
  var col=ev.target.closest&&ev.target.closest('.daycol');
  if(!col){if(hovIdx>=0)clearHover();return}
  var r=col.getBoundingClientRect(), idx=Math.floor((ev.clientY-r.top)/ROW), n=(END-START)/30;
  if(idx<0||idx>=n){clearHover();return}
  var onEmpty=ev.target===col, key=idx+'|'+col.dataset.date+'|'+onEmpty;
  if(key===hovIdx)return; clearHover(); hovIdx=key;
  var tms=$$('.times .tm'); if(tms[idx])tms[idx].classList.add('hov');
  var grid=col.parentNode, gr=grid.getBoundingClientRect(), line=document.createElement('div');
  line.id='hovRow'; line.style.top=(r.top-gr.top+idx*ROW)+'px'; line.style.height=ROW+'px'; grid.appendChild(line);
  if(onEmpty){var g=document.createElement('div');g.id='hovGhost';g.style.top=(idx*ROW+2)+'px';g.style.height=(ROW-4)+'px';g.textContent='+ '+show(START+idx*30);col.appendChild(g)}
});
document.addEventListener('mouseleave',clearHover);
document.addEventListener('keydown',function(ev){
  if(ev.target.classList&&ev.target.classList.contains('pacin')&&/^(ArrowDown|ArrowUp|Enter)$/.test(ev.key)){pacKey(ev);return}
  if(ev.key!=='Escape')return;
  if($$('.opts').some(function(l){return !l.hidden})){closeOpts();return}
  if(!$('#overlay2').hidden){if(dlgCloseOk('dlg2'))$('#overlay2').hidden=true;return}
  if(!$('#overlay').hidden&&dlgCloseOk('dlg'))closeModal();
});
var mq=window.matchMedia('(max-width:760px)');
if(mq.addEventListener)mq.addEventListener('change',render);else if(mq.addListener)mq.addListener(render);
setInterval(function(){if(staff&&ui.view==='agenda'&&!busy())render()},60000);

document.addEventListener('submit',function(ev){
  if(ev.target.id!=='lForm')return; ev.preventDefault();
  var m=$('#lMail').value.trim(), p=$('#lPass').value, b=$('#lBtn'), e=$('#lErr');
  if(!m||!p){e.textContent='Completá mail y contraseña.';e.hidden=false;return}
  b.disabled=true;b.textContent='Entrando…';e.hidden=true;
  auth.signInWithEmailAndPassword(m,p).catch(function(err){
    var c=err.code||'';
    showLogin(/wrong-password|invalid-credential|user-not-found|invalid-email|invalid-login/.test(c)?'Mail o contraseña incorrectos.':c==='auth/too-many-requests'?'Demasiados intentos. Esperá unos minutos.':'No se pudo ingresar. Revisá la conexión.');
  });
});
document.addEventListener('focusout',function(){setTimeout(function(){if(pendingRender&&!busy())scheduleRender()},0)});
})();
